<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PP2026 Sponsor Eblast Kit</title>
<style>
:root{--pink:#d31876;--gray:#444;--light:#faf5f8;--border:#ddd6ec;--muted:#6b6580}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--light);color:#1d1a1c;min-height:100vh}
.hdr{background:var(--pink);color:#fff;padding:30px 28px 24px}
.hdr-in{max-width:580px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-bottom:8px}
h1{font-size:26px;font-weight:700}
.hdr-sub{font-size:13px;opacity:.8;margin-top:5px}
.chip{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;margin-top:12px}
.main{max-width:580px;margin:0 auto;padding:30px 24px 60px}
.steps{display:flex;flex-direction:column;gap:14px}
.step{background:#fff;border:1px solid var(--border);border-radius:12px;padding:22px;display:flex;gap:16px}
.num{width:34px;height:34px;border-radius:50%;background:var(--pink);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.step h2{font-size:15px;font-weight:700;margin-bottom:4px}
.step p{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;width:100%;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-pink{background:var(--pink);color:#fff}
.btn-outline{background:#fff;color:var(--pink);border:2px solid var(--pink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.sec{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.contacts{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.crow{display:flex;align-items:center;gap:12px}
.av{width:32px;height:32px;border-radius:50%;background:var(--pink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ci strong{display:block;font-size:13px;font-weight:700}
.ci a{font-size:12px;color:var(--pink);text-decoration:none}
.ci a:hover{text-decoration:underline}
.cc{font-size:10px;color:var(--muted);background:#f2eef1;border-radius:4px;padding:1px 6px;margin-left:4px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:14px}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--pink);margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:5px}
.field input{width:100%;border:1.5px solid #ddd;border-radius:7px;padding:10px 12px;font-size:14px;color:#1d1a1c;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--pink)}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.abtn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;padding:11px 18px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;transition:opacity .15s}
.abtn:hover{opacity:.85}
.abtn-p{background:var(--pink);color:#fff}
.abtn-s{background:#fff;color:var(--gray);border:1.5px solid #ddd}
.out{background:#f5f3fb;border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:16px;display:none}
.out-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
.out-url{font-size:12px;color:var(--pink);word-break:break-all;background:#fff;border:1px solid var(--border);border-radius:5px;padding:8px 10px;margin-bottom:10px;font-family:monospace}
.cbtn{background:var(--pink);color:#fff;border:none;border-radius:5px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer}
.cbtn:hover{opacity:.85}
.err{background:#fff4f4;border:1px solid #f0d0d0;border-radius:8px;padding:12px 14px;font-size:13px;color:#c0304a}
.directory{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.drow-name{font-size:13px;font-weight:700}
.tier{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-left:7px;vertical-align:middle}
.tier-platinum{background:#e4e8ee;color:#48566b}
.tier-gold{background:#f2e8d2;color:#a1791f}
.tier-silver{background:#eae7e0;color:#847e73}
.tier-bronze{background:#f0e2d6;color:#8a5837}
.tier-community{background:#eceae4;color:#8a887f}
.drow-actions{display:flex;flex-wrap:wrap;gap:6px}
.mini{font-size:11.5px;font-weight:700;border:none;border-radius:6px;padding:7px 11px;cursor:pointer;text-decoration:none;white-space:nowrap}
.mini-p{background:var(--pink);color:#fff}
.mini-s{background:#f2eef1;color:var(--gray)}
.dates{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.date-opt{display:flex;align-items:center;gap:10px;background:#f5f3fb;border:1.5px solid var(--border);border-radius:9px;padding:12px 14px;cursor:pointer}
.date-opt input{width:17px;height:17px;accent-color:var(--pink)}
.date-opt span{font-size:13.5px;font-weight:600}
.date-count{font-size:11px;color:var(--muted);margin-bottom:12px}

.cal{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;background:#fff}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-hd strong{font-size:14px}
.cal-nav{background:#f2eef1;border:none;border-radius:6px;width:30px;height:30px;font-size:16px;cursor:pointer;color:var(--gray)}
.cal-nav[disabled]{opacity:.35;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:10px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.cal-day{position:relative;border:none;background:#f5f3fb;border-radius:6px;height:36px;font-size:13px;font-weight:600;color:#1d1a1c;cursor:pointer}
.cal-day:hover{outline:1.5px solid var(--pink)}
.cal-day.off{background:transparent;color:#ccc;cursor:default;outline:none}
.cal-day.taken{background:#eee;color:#aaa;text-decoration:line-through;cursor:not-allowed;outline:none}
.cal-day.mine{background:#e6f4ea;color:#1e7a3a}
.cal-day.sel{background:var(--pink);color:#fff}
.cal-day .rk{position:absolute;top:1px;right:3px;font-size:9px;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:4px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.picked{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pchip{background:#fff;border:1.5px solid var(--pink);color:var(--pink);border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700}
.pchip button{background:none;border:none;color:var(--pink);font-weight:700;cursor:pointer;margin-left:4px}
.msg{font-size:12.5px;border-radius:8px;padding:10px 12px;margin-top:10px;display:none}
.msg.ok{display:block;background:#eef8f1;border:1px solid #cfe9d6;color:#1e7a3a}
.msg.bad{display:block;background:#fff4f4;border:1px solid #f0d0d0;color:#c0304a}
.msg.info{display:block;background:#f6f3f5;border:1px solid var(--border);color:var(--gray)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{border:1.5px solid var(--border);background:#fff;border-radius:7px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--gray)}
.tab.on{background:var(--pink);border-color:var(--pink);color:#fff}
.trow{border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#fff}
.trow-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trow-date{font-size:13px;font-weight:700}
.st{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:5px}
.st-requested{background:#fdf0d8;color:#9a6a12}
.st-booked{background:#e6f4ea;color:#1e7a3a}
.st-blocked{background:#eee;color:#777}
.trow-sp{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.spn{font-size:12px;background:#f7f3f6;border-radius:6px;padding:4px 8px}
.pkg{background:#fff;border:1px solid var(--border);border-left:4px solid var(--pink);border-radius:12px;padding:16px 20px;margin-bottom:14px}
.pkg ul{margin:0 0 0 18px;font-size:14px;line-height:1.7}
.naming{background:#faf5f8;border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin:0 0 14px}
.naming-h{font-size:12px;font-weight:700;color:var(--gray);margin-bottom:8px}
.nrow{display:flex;gap:10px;align-items:baseline;font-size:12px;margin-bottom:5px;flex-wrap:wrap}
.nrow code,.naming code{background:#fff;border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:12px;color:var(--pink);font-weight:700}
.nrow span{color:var(--muted)}
.tier-vipbag{background:#f3e3ee;color:#9a1d63}
/* ---- Obligations tracker (team view) ---- */
body.admin .hdr-in,body.admin .main{max-width:1240px}
.ob-sub{font-size:12px;color:var(--muted);line-height:1.55;margin:-4px 0 16px;max-width:110ch}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 16px;min-width:118px}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat.pink b{color:var(--pink)} .stat.ok b{color:#1e7a3a} .stat.warn b{color:#b5502e}
.ob-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.ob-search{flex:1;min-width:200px;border:1.5px solid #ddd;border-radius:8px;padding:9px 12px;font-size:13.5px;outline:none}
.ob-search:focus{border-color:var(--pink)}
.fchip{border:1.5px solid var(--border);background:#fff;border-radius:16px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--gray)}
.fchip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.ob-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:12px}
table.ob{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1080px}
table.ob th{position:sticky;top:0;background:#faf5f8;text-align:left;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}
table.ob td{padding:10px;border-bottom:1px solid #f1e6ec;vertical-align:top;line-height:1.45}
table.ob tr:last-child td{border-bottom:none}
table.ob tr.flag td:first-child{box-shadow:inset 3px 0 0 #e0902e}
table.ob tr.old td{color:#999}
.sp-name{font-weight:700;font-size:13px}
.sp-lead{font-size:11px;color:var(--muted);margin-top:2px}
.ob-n{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.ob-n.zero{color:#c9b8c2;font-weight:400}
.dash{color:#c9b8c2}
.dt{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 6px;margin:0 3px 3px 0;white-space:nowrap}
.dt-o{background:#f1f1f4;color:#555} .trk{margin-top:4px;padding-top:4px;border-top:1px dashed var(--border)}
.mine-list{list-style:none;padding:0;margin:8px 0 0} .mine-list li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--border);font-size:14px} .mine-list li:first-child{border-top:none} .mine-list b{font-weight:700}
.dt-b{background:#e6f4ea;color:#1e7a3a} .dt-r{background:#fdf0d8;color:#9a6a12} .dt-n{background:#f6e2da;color:#b5502e} .dt-x{background:#eee;color:#888}
.note{font-size:11.5px;color:#555;min-width:220px;max-width:320px}
.note.fl{color:#9a4a10}
td.acts{min-width:150px}
td.acts .mini{padding:5px 8px;font-size:11px;margin:0 2px 3px 0;display:inline-block}
.mini.off{opacity:.4;pointer-events:none}
button.dt{border:none;cursor:pointer;font-family:inherit}
button.dt-rej{background:#fde2e2;color:#b00020;margin-left:-2px} button.dt-rej:hover{outline:1.5px solid #b00020}
.signbox{position:relative;z-index:5;display:block;min-width:260px;background:#fff;border:2px solid var(--pink);border-radius:10px;padding:12px 14px;margin:6px 0;box-shadow:0 6px 20px rgba(0,0,0,.15);font-size:13px;white-space:normal}
.signbox input{font:inherit;padding:6px 8px;border:1px solid var(--border);border-radius:6px;width:100%;box-sizing:border-box;margin-bottom:8px}
.rjbox{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;background:#fff5f5;border:1px solid #f3c4c4;border-radius:6px;padding:4px 6px;margin:0 3px 3px 0;font-size:11px}
.rjbox input{font:inherit;font-size:11px;padding:1px 3px;border:1px solid var(--border);border-radius:4px}
button.dt-r:hover{outline:1.5px solid #9a6a12}
button.dt-b:hover,button.dt-x:hover{outline:1.5px solid #888}
td.ct{font-size:11.5px;min-width:180px}
a.em{display:block;color:var(--pink);text-decoration:none;word-break:break-all}
a.em:hover{text-decoration:underline}
.own{font-size:12.5px;color:#1d1a1c;margin-bottom:5px}
.own.none{color:#b9a9b2}
a.sp-name{color:#1d1a1c;text-decoration:none}
a.sp-name:hover{color:var(--pink);text-decoration:underline}
.ob-bar.gen{background:#faf5f8;border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.gen-l{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ob-bar.gen .ob-search{padding:7px 10px;font-size:12.5px;min-width:160px}
.gen-out{font-size:12px;word-break:break-all}
.gen-out a{color:var(--pink)}
table.ob{min-width:980px}
.mc-hd{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.mc-hd strong{font-size:15px}
.mc{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mc-dow{font-size:10px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.mc-day{min-height:86px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:4px 5px;overflow:hidden}
.mc-day.off{background:transparent;border-color:transparent}
.mc-day.today{border-color:var(--pink);box-shadow:inset 0 0 0 1px var(--pink)}
.mc-n{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px}
.ev{font-size:10.5px;line-height:1.3;border-radius:4px;padding:2px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev i{font-style:normal;opacity:.75}
.ev-r{background:#fdf0d8;color:#7a520c}.ev-b{background:#e6f4ea;color:#1e7a3a}.ev-d{background:#e9e6ea;color:#555}.ev-x{background:#eee;color:#888}
.logbox{background:#faf5f8;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:14px 0}
select.ob-search{background:#fff}
.ob-foot{font-size:11px;color:var(--muted);margin-top:8px}
.keyp{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin:0 0 14px;background:#fff}
.keyp.locked{border-color:var(--pink);background:#fdf3f8}
.keyp.open{border-color:#9fd3ae;background:#f0f9f2}
.keyp b{font-size:13px}
.keyp .kt{flex:1 1 220px;font-size:12px;color:var(--gray);line-height:1.45}
.keyp form{display:flex;gap:8px;flex:1 1 100%;min-width:0}
.keyp input{flex:1;min-width:0;width:100%;font:inherit;font-size:14px;padding:9px 10px;border:1.5px solid var(--border);border-radius:8px}
.keyp .kbtn{border:0;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:700;background:var(--pink);color:#fff;cursor:pointer}
.keyp .kbtn:disabled{opacity:.6;cursor:default}
.keyp .klink{border:1.5px solid var(--border);background:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--gray);cursor:pointer}
.keyp .khead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-basis:100%}
.keyp .tl{background:none;border:0;padding:0;color:var(--pink);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
.keyp .kerr{flex-basis:100%;font-size:12px;color:#b00020;font-weight:700}
</style>
</head>
<body>

<div class="hdr">
<div class="hdr-in">
<div class="eyebrow">Pines Party 2026 &mdash; Fire Island Pines</div>
<h1 id="pgTitle">Sponsor Eblast Kit</h1>
<div class="hdr-sub" id="pgSub">Post-event eblast system for PP2026 sponsors.</div>
<div id="pgChip" class="chip" style="display:none"></div>
</div>
</div>

<div class="main" id="main"></div>

<script>
// PP2026 Sponsor Hub + team dashboard. Everything about sponsors (what they're owed, folders, contacts) comes
// from the server (Apps Script reading the Obligations sheet). This file holds NO contacts, notes or folders:
//   no key            -> sponsor names / tiers / counts only
//   ?s=<key> (Hub)    -> that sponsor's own row only
//   admin key         -> everything
// Writes are CORS POSTs whose JSON reply is read: the page shows the server's real result or error.

// Kit folder (writing guide, template, example) — shared by every sponsor
var KIT = 'https://drive.google.com/drive/folders/1f-x19JB9m2c3_YA4Ia2f7_in78xCXDcT?usp=drive_link';
var STORY_GEN = 'https://marioguardado1030.github.io/pp2026-asset-builder/';

var TEAM = [
{n:'Mario Guardado', e:'mario.guardado@pinesparty.com', i:'MG', cc:false},
{n:'Tim Dejsiriudom', e:'tdejsiriudom@pinesparty.com', i:'TD', cc:true},
{n:'Tejesh Mistry', e:'tj@pinesparty.com', i:'TM', cc:true}
];

// Live backend — Apps Script Web App (PinePartyCalenar). Hardcoded: every device hits the same backend.
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwkXN4_2_PWGGurtNTPZc7m-NwBGFN6lElJB7b0WJPbseXDjppwAbJgq5TrGvLFujlnjQ/exec';

function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
var DATE_MIN = ymd(new Date());
var DATE_MAX = '2027-06-30';
var TODAY = DATE_MIN;

var TIER_LABEL = {platinum:'Platinum', gold:'Gold', silver:'Silver', bronze:'Bronze', community:'Community', vipbag:'VIP Bag'};
var TIER_KEY = {platinum:'platinum', gold:'gold', silver:'silver', bronze:'bronze', community:'community', 'vip bag':'vipbag', vipbag:'vipbag'};
// "Gilead Pines Party Hub": the sponsor's page. Short names where the full name is long.
var HUB_SHORT = {'Gilead Sciences': 'Gilead', 'Tryst Hospitality / MISTR': 'Tryst / MISTR'};

// ---------- small helpers
function slug(name) { return String(name || '').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function esc(s) { return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v) { var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }
function driveUrl(id) { return 'https://drive.google.com/drive/folders/'+encodeURIComponent(id); }
// Drive folder id from a link or a bare id; anything else -> '' (never trusted into an href).
function folderIdOf(v) { var m = String(v || '').match(/folders\/([\w-]+)/), id = m ? m[1] : String(v || '').trim(); return /^[\w-]{10,}$/.test(id) ? id : ''; }
function fmtDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'}); }
function shortDate(s) { var p = s.split('-'); return (+p[1])+'/'+(+p[2]); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
var NUMW = ['zero','one','two','three','four','five','six','seven','eight'];
function numw(n) { return NUMW[n] || String(n); }
function andList(a, word) { return a.length < 2 ? a.join('') : a.slice(0,-1).join(', ') + ' ' + (word || 'and') + ' ' + a[a.length-1]; }
function itemType(item) { return /^eblast/i.test(item) ? 'eblast' : 'story'; }

// ---------- sponsors (from the server)
var SPONSORS = [];
// One Obligations row (as the server sends it) -> the page's sponsor object.
function fromRow(r) {
var st = String(r.Status || '').toLowerCase();
return {
n: r.Sponsor, key: r.Key || slug(r.Sponsor), aka: r.Aka || '', t: TIER_KEY[String(r.Tier || '').toLowerCase()] || 'community',
eb: num(r.Eblasts), ebSent: num(r['Eblasts Sent']), st: num(r.Stories), sh: num(r['Shout-outs']),
ct: r.Contact || '', em: r.Emails || '', lead: r['PP Lead'] || '', note: r.Notes || '', eml: r['Extra Email Line'] || '', tag: r['File Tag'] || '',
id: folderIdOf(r['Asset Folder']) || null, id2: folderIdOf(r['Asset Folder 2']) || '', ph: folderIdOf(r['Photo Folder']) || '',
flag: st === 'needs check', old: st === 'not 2026' ? (r.Notes || 'Not 2026') : ''
};
}
// Exact name / key first; an aka only if exactly one sponsor has it (same rule as the server).
function findSponsor(key) {
var k = slug(key);
var exact = SPONSORS.filter(function(sp){ return slug(sp.n) === k || sp.key === k; });
if (exact.length) return exact[0];
var aka = SPONSORS.filter(function(sp){ return sp.aka && sp.aka.split(',').some(function(a){ return slug(a) === k; }); });
return aka.length === 1 ? aka[0] : null;
}
function hubShort(sp) { return HUB_SHORT[sp.n] || String(sp.n).split(/\s*[\/(]/)[0].trim(); }
function hubName(sp) { return hubShort(sp) + ' Pines Party Hub'; }
// A sponsor's Hub link carries the start of their Drive folder ID (hard to guess). No folder -> no link.
var HUB_F_LEN = 12;
function sponsorLink(sp) { return sp.id ? window.location.origin + window.location.pathname + '?s=' + slug(sp.n) + '&f=' + encodeURIComponent(sp.id.slice(0, HUB_F_LEN)) : ''; }
function linkFor(name, driveLink) {
return window.location.origin + window.location.pathname + '?sponsor=' + encodeURIComponent(name) + (driveLink ? '&drive=' + encodeURIComponent(driveLink) : '');
}
function ebLeft(sp) { return Math.max(0, (sp.eb || 0) - (sp.ebSent || 0)); }
// Social owed -> stories the sponsor requests + shout-outs the team schedules.
function socSplit(s) { var tot = (s.st || 0) + (s.sh || 0); return tot ? {total: tot, stories: s.st || 0, shouts: s.sh || 0} : null; }
function socOwed(s) { var x = socSplit(s); return x ? x.stories : 0; }
function hasSocial(sp) { return socOwed(sp) > 0; }

function contactsHTML() {
return TEAM.map(function(c){
return '<div class="crow"><div class="av">'+c.i+'</div><div class="ci">'
+'<strong>'+c.n+(c.cc?'<span class="cc">CC</span>':'')+'</strong>'
+'<a href="mailto:'+c.e+'">'+c.e+'</a></div></div>';
}).join('');
}

// ---------- backend
var CAL = { eblast: [], story: [] }, CAL_OK = false;
var TRACKER = [];  // Internal Tracker rows (team view; needs the admin key)
var MINE = null;   // this sponsor's items (Hub view; client wording)
var ME = null;     // this sponsor's own Obligations row (Hub view)
var ME_ERR = '';   // why ME is missing: unknown | not2026 | unavailable
var STATUSES = []; // [{status, only}] from the server: the one status list
var HUB_Q = '';    // Hub: the ?s= key (or old ?sponsor= name) sent with every read
var HUB_PROOF = {}; // Hub: {f} or {drive} from the link; the server checks it against the sponsor's folder
var SPONSOR = '';  // Hub: the sponsor's canonical name (from the server)
var ADMIN = { key: '', ok: false, cc: '' }; // ok/cc: set when the server accepts the key
try { ADMIN.key = localStorage.getItem('ppAdminKey') || ''; } catch (e) {}

// Reads: GET with a timeout. Hub reads are scoped to the sponsor; team reads send the key if there is one.
function getJSON(ms) {
var ctl = window.AbortController ? new AbortController() : null;
var t = setTimeout(function(){ if (ctl) ctl.abort(); }, ms);
var q = HUB_Q ? '&sponsor=' + encodeURIComponent(HUB_Q) + Object.keys(HUB_PROOF).map(function(k){ return '&' + k + '=' + encodeURIComponent(HUB_PROOF[k]); }).join('')
: (ADMIN.key ? '&key=' + encodeURIComponent(ADMIN.key) : '');
return fetch(GAS_URL + '?_t=' + Date.now() + q, ctl ? {signal: ctl.signal} : {})
.then(function(r){ clearTimeout(t); return r.json(); });
}
function loadCalendar() {
return getJSON(15000).catch(function(){ return getJSON(15000); })
.then(function(d){
if (!d || !d.rows) throw new Error((d && d.error) || 'Bad response');
CAL.eblast = d.rows || []; CAL.story = d.story || []; CAL_OK = true;
TRACKER = d.tracker || [];
ADMIN.ok = !!d.admin; ADMIN.cc = d.draftCc || '';
ME_ERR = d.meError || '';
if (d.statuses) STATUSES = d.statuses;
if (HUB_Q) { ME = d.me || null; MINE = d.mine || null; if (ME) SPONSOR = ME.Sponsor; }
else if (d.sponsors && d.sponsors.length) SPONSORS = d.sponsors.filter(function(r){ return r.Sponsor; }).map(fromRow);
return d;
});
}
// Writes: POST, read the JSON reply. Rejects with the server's own error message.
function post(params) {
return fetch(GAS_URL, {method:'POST', body: new URLSearchParams(params)})
.then(function(r){ return r.text(); }, function(){ throw new Error('Couldn\'t reach the server. Check your connection and try again.'); })
.then(function(t){ try { return JSON.parse(t); } catch (e) { throw new Error('The server sent an unexpected reply. Try again in a minute.'); } })
.then(function(d){ if (!d || d.ok === false) throw new Error((d && d.error) || 'The server didn\'t answer.'); return d; });
}

function isLocked(st) { return st === 'booked' || st === 'approved' || st === 'blocked'; }
function rowFor(type, date) {
var rows = CAL[type];
for (var i = 0; i < rows.length; i++) if (rows[i].date === date) return rows[i];
return null;
}
function hasSponsor(row, name) {
return !!row && row.sponsors.split(',').map(function(x){ return x.trim(); }).indexOf(name) !== -1;
}
function setMsg(id, cls, html) {
var m = document.getElementById('msg-'+id);
if (!m) return;
m.className = 'msg ' + cls; m.innerHTML = html;
}

// ---------- sponsor email (Email Draft). Links are embedded as text, never shown as raw URLs.
function signer() { try { return (localStorage.getItem('ppSigner') || '').trim(); } catch (e) { return ''; } }
function saveSigner(v) { try { localStorage.setItem('ppSigner', v.trim()); } catch (e) {} }
function greetName(sp) {
var first = (sp.ct || '').split(/,|;|&|\//).map(function(x){ return x.trim().split(/\s+/)[0]; }).filter(Boolean);
if (!first.length) return sp.n + ' team';
return first.length === 1 ? first[0] : first.slice(0,-1).join(', ') + ' and ' + first[first.length-1];
}
function pkgSentence(sp) {
var out = [], x = socSplit(sp);
if (sp.eb) out.push(numw(sp.eb) + ' dedicated ' + (sp.eb === 1 ? 'eblast' : 'eblasts') + ' to the Pines Party list' + (sp.ebSent ? ' (' + (sp.ebSent >= sp.eb ? 'already sent' : numw(sp.ebSent) + ' already sent') + ')' : ''));
if (x && x.stories) out.push(numw(x.stories) + ' Instagram ' + (x.stories === 1 ? 'story' : 'stories') + ' on the Pines Party account');
if (x && x.shouts) out.push(numw(x.shouts) + ' ' + (x.shouts === 1 ? 'shout-out' : 'shout-outs') + ' that we schedule for you');
return andList(out);
}
var SG = '{{STORY_GENERATOR}}'; // placeholder: becomes a link in HTML, plain words in text
function emailSteps(sp) {
var st = [], x = socSplit(sp), k = x ? x.stories : 0, e = ebLeft(sp);
if (e) st.push('Open the writing kit, which has a guide, a template and an example, and draft your eblast copy');
if (k) st.push('Build your Instagram ' + (k === 1 ? 'story' : 'stories') + ' with our ' + SG + '. We\'ve made it easy to build a story, download it and share it with us, then select your desired dates');
var fp = filePrefixes(sp).map(function(f){ return f.p; });
st.push((e ? 'Upload your logo, photos and copy' + (k ? ', plus your story video and brief' : '') : 'Upload the story video and brief you download from the Story Generator') + ' to your folder.'
  + (fp.length ? ' Please start each file name with ' + andList(fp, 'or') + ' so we can keep everything straight' : ''));
if (e) st.push('Pick your preferred send dates. ' + (e === 1 ? 'Choose two options for your eblast, and we\'ll confirm one'
  : 'Choose two options for each eblast (' + numw(2 * e) + ' total), and we\'ll confirm one date for each'));
if (k) st.push('Pick your Instagram story dates. ' + (k === 1 ? 'Choose two options for your story, and we\'ll confirm one'
  : 'Choose two options for each story (' + numw(2 * k) + ' total), and we\'ll confirm one date for each'));
return st;
}
function emailClose() {
return ['We\'ll email you once your dates are locked in. After the event, we\'ll also add your photos to your folder, so you\'ll find them on the same page.',
        'Thanks again for being part of this. If anything comes up, just reply here and I\'ll help.'];
}
function emailSubject(sp) { return 'Pines Party 2026: Your ' + hubName(sp); }
function sponsorEmailHTML(sp) {
return '<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.55;color:#222">'
+ '<p>Hi ' + esc(greetName(sp)) + ',</p>'
+ '<p>Thank you so much for supporting Pines Party 2026. As a ' + TIER_LABEL[sp.t] + ' sponsor, your package includes ' + esc(pkgSentence(sp)) + '.</p>'
+ '<p>To make things easy, we\'ve put everything in one place: <a href="' + esc(sponsorLink(sp)) + '"><b>' + esc(hubName(sp)) + '</b></a></p>'
+ '<p>From there you can:</p><ol>' + emailSteps(sp).map(function(x){ return '<li>' + esc(x).replace(SG, '<a href="' + STORY_GEN + '"><b>Story Generator</b></a>') + '</li>'; }).join('') + '</ol>'
+ (sp.eml ? '<p>' + esc(sp.eml) + '</p>' : '')
+ emailClose().map(function(x){ return '<p>' + esc(x) + '</p>'; }).join('')
+ '<p>Thanks again for your support,<br>' + esc(signer()) + '</p></div>';
}
function pkgItems(sp) {
var out = [], x = socSplit(sp);
if (sp.eb) out.push(plural(sp.eb, 'dedicated eblast', 'dedicated eblasts') + ' to the Pines Party list');
if (x && x.stories) out.push(plural(x.stories, 'Instagram story', 'Instagram stories') + ' on the Pines Party account');
if (x && x.shouts) out.push(plural(x.shouts, 'shout-out', 'shout-outs') + ' from Pines Party (we schedule these)');
return out;
}
// File-name tag for a sponsor: name before any "/" or "(", letters and digits only ("High Noon (Gallo) / ..." -> "HighNoon").
function fileTag(sp) {
if (sp.tag) return sp.tag;
return String(sp.n).split(/\s*[\/(]/)[0].replace(/[^A-Za-z0-9]+/g, '') || 'Sponsor';
}
function filePrefixes(sp) {
var out = [], i, x = socSplit(sp), n = ebLeft(sp), k = x ? x.stories : 0, t = fileTag(sp) + '_';
for (i = 1; i <= n; i++) out.push({p: t + 'Eblast' + i + '_', ex: [t + 'Eblast' + i + '_Copy.docx', t + 'Eblast' + i + '_Photo1.jpg']});
for (i = 1; i <= k; i++) out.push({p: t + 'InstagramStory' + i + '_', ex: [t + 'InstagramStory' + i + '_Video.mp4', t + 'InstagramStory' + i + '_Brief.txt']});
return out;
}
function namingHTML(sp) {
var f = filePrefixes(sp);
if (!f.length) return '';
return '<div class="naming"><div class="naming-h">Name your files so we know what each one is for</div>'
+ f.map(function(x){ return '<div class="nrow"><code>'+esc(x.p)+'</code><span>'+x.ex.map(esc).join(' &middot; ')+'</span></div>'; }).join('')
+ '<div class="hint">Everything goes in the same folder. Shared files (like your logo) can be named <code>'+esc(fileTag(sp))+'_All_Logo.png</code>.</div></div>';
}
// No signer yet: ask right next to the button, then continue drafting.
function askSigner(btn, i) {
var old = document.querySelector('.signbox'); if (old) old.remove();
var box = document.createElement('div'); box.className = 'signbox';
box.innerHTML = '<b>Who is signing this email?</b><div style="font-size:12px;color:var(--muted);margin:2px 0 8px">Your name goes at the bottom of the email. We\'ll remember it on this computer.</div>'
+ '<input type="text" placeholder="Your name, e.g. Mario"/> <button class="mini mini-p">Sign &amp; draft email</button> <button class="mini mini-s">Cancel</button>';
var inp = box.querySelector('input'), bs = box.querySelectorAll('button');
function go() { var v = inp.value.trim(); if (!v) { inp.focus(); inp.style.borderColor = '#b00020'; return; }
saveSigner(v); box.remove(); drawKey(); draftEmail(btn, i); }
bs[0].onclick = go; bs[1].onclick = function(){ box.remove(); };
inp.onkeydown = function(e){ if (e.key === 'Enter') go(); if (e.key === 'Escape') box.remove(); };
btn.parentNode.insertBefore(box, btn.nextSibling); inp.focus();
}
// Creates a real Gmail draft (never sends). If one exists, the button turns into "Replace draft".
function draftEmail(btn, i, replace) {
var sp = SPONSORS[i];
if (!signer()) { askSigner(btn, i); return; }
var orig = 'Email Draft'; btn.disabled = true; btn.textContent = 'Drafting…';
var q = {action:'draft', key:ADMIN.key, to:(sp.em||'').replace(/\s+/g,''), subject:emailSubject(sp), html:sponsorEmailHTML(sp)};
if (replace) q.replace = '1';
post(q).then(function(d){
if (d.existing) {
setMsg('ob', 'info', 'A draft already exists for ' + esc(sp.n) + ' in mario.guardado@pinesparty.com. Click <b>Replace draft</b> to swap it for a fresh one.');
btn.textContent = 'Replace draft'; btn.onclick = function(){ draftEmail(btn, i, true); };
} else {
setMsg('ob', 'ok', 'Gmail draft ' + (d.replaced ? 'replaced' : 'created') + ' for ' + esc(sp.n) + ' in mario.guardado@pinesparty.com. Review it in Drafts before sending.');
btn.textContent = 'Email Draft ✓'; btn.onclick = function(){ draftEmail(btn, i); };
}
}).catch(function(e){
// Manual fallback. Opening Gmail and copying must happen inside a click, so it gets its own button.
setMsg('ob', 'bad', 'Couldn\'t create the Gmail draft (' + esc(e.message) + '). '
+ '<button class="mini mini-p" id="gmailFallback">Open Gmail + copy the email</button> Then click in the body and paste (Cmd+V); links stay embedded.');
document.getElementById('gmailFallback').onclick = function(){ openGmailFallback(sp); };
btn.textContent = orig;
}).then(function(){ btn.disabled = false; });
}
// Runs inside the click: a synchronous rich-text copy first (keeps the click's popup permission), then Gmail.
function openGmailFallback(sp) {
var div = document.createElement('div');
div.contentEditable = 'true'; div.style.position = 'fixed'; div.style.left = '-9999px';
div.innerHTML = sponsorEmailHTML(sp);
document.body.appendChild(div);
try {
var range = document.createRange(); range.selectNodeContents(div);
var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
document.execCommand('copy'); sel.removeAllRanges();
} catch (x) {}
div.remove();
// Body left empty on purpose: a plain-text body would show raw URLs. The formatted email is on the clipboard.
window.open('https://mail.google.com/mail/?authuser=mario.guardado@pinesparty.com&view=cm&fs=1&to=' + encodeURIComponent((sp.em||'').replace(/\s+/g,'')) + '&cc=' + encodeURIComponent(ADMIN.cc) + '&su=' + encodeURIComponent(emailSubject(sp)), '_blank');
}

// ---------- Hub (sponsor view): ?s=<key>
function getParams() {

}
function bootHub(p) {

if (p.f) HUB_PROOF.f = p.f; else if (p.drive) HUB_PROOF.drive = p.drive;
document.getElementById('main').innerHTML = '<div class="hint" style="padding:24px 0">Loading your Hub&hellip;</div>';
loadCalendar().catch(function(){ ME_ERR = 'unavailable'; }).then(function(){
var sp = ME ? fromRow(ME) : null;
// Not in the sheet (or the server is down) but the link carries a folder: still show the upload / photos page.
if (!sp && p.drive && ME_ERR !== 'not2026') sp = fromRow({Sponsor: p.key});
if (!sp) {
var why = ME_ERR === 'not2026' ? 'This Hub was for an earlier Pines Party season.'

b.disabled = true; b.textContent = 'Saving…';
var q = {action:'reject', type:t, date:d, sponsor:sp, key:ADMIN.key}; if (prop) q.propose = prop;
post(q).then(function(){ return afterWrite('Rejected ' + esc(sp) + ' request for ' + fmtDate(d) + (prop ? '; proposed ' + fmtDate(prop) + ' (shows as their pick; approve it once they agree).' : '.')); })
.catch(fail);
}
// Log something that already went out (or a date agreed by email) without a sponsor request.
function logHTML() {
return '<div class="logbox"><div class="card-title" style="margin-bottom:8px">Log a send / post</div>'
+ '<div class="hint" style="margin-bottom:10px">For eblasts and stories that already went out, or a date agreed by email. A past date logs it as Sent / Posted; a future date schedules it.</div>'
+ '<div class="ob-bar"><select id="lgS" class="ob-search"></select>'
+ '<select id="lgT" class="ob-search" style="flex:0 1 150px"><option value="eblast">Eblast</option><option value="story">Instagram story</option></select>'
+ '<input id="lgD" type="date" class="ob-search" style="flex:0 1 170px"/>'
+ '<button class="fchip on" onclick="logSend(this)">Save</button></div><div class="msg" id="msg-log"></div></div>';
}
function logSend(btn) {
if (needKey('log')) return;
var sp = document.getElementById('lgS').value, t = document.getElementById('lgT').value, d = document.getElementById('lgD').value;
if (!d) { setMsg('log', 'bad', 'Pick a date.'); return; }
btn.disabled = true; btn.textContent = 'Saving…';
post({action:'approve', type:t, date:d, sponsor:sp, key:ADMIN.key})
.then(function(){ return afterWrite(); })
.then(function(){ setMsg('log', 'ok', 'Saved: ' + esc(sp) + ' ' + (t==='story'?'story':'eblast') + ' on ' + fmtDate(d) + (d < TODAY ? ' (sent/posted).' : ' (scheduled).')); })
.catch(function(e){ setMsg('log', 'bad', esc(e.message)); })
.then(function(){ btn.disabled = false; btn.textContent = 'Save'; });
}

// Calendar tab (read-only): month grid + list by date.
var MCAL = null;
function monthGridHTML() {
if (!MCAL) { var t = new Date(); MCAL = new Date(t.getFullYear(), t.getMonth(), 1); }
var y = MCAL.getFullYear(), m = MCAL.getMonth(), first = new Date(y, m, 1).getDay(), days = new Date(y, m+1, 0).getDate();
function items(ds) {
var out = [];
['eblast','story'].forEach(function(type){
(CAL[type]||[]).forEach(function(r){
if (r.date !== ds || !(r.sponsors || r.status)) return;
var lab = type === 'eblast' ? 'Eblast' : 'Story';
var st = r.status === 'blocked' ? 'x' : isLocked(r.status) ? (r.date < TODAY ? 'd' : 'b') : 'r';
var who = r.status === 'blocked' ? 'Blocked' : r.sponsors;
var tag = st === 'r' ? 'Req' : st === 'x' ? '' : (r.sponsors ? bookedLabel(r.sponsors, type, r.date) : 'Booked');
out.push('<div class="ev ev-'+st+'" title="'+esc(lab+' · '+tag+' · '+who)+'"><b>'+lab+'</b> '+esc(who)+(tag?' <i>'+esc(tag)+'</i>':'')+'</div>');
});
});
return out.join('');
}
var h = '<div class="mc-hd"><button class="cal-nav" onclick="shiftMonth(-1)">&lsaquo;</button><strong>'
+ MCAL.toLocaleDateString('en-US',{month:'long',year:'numeric'}) + '</strong><button class="cal-nav" onclick="shiftMonth(1)">&rsaquo;</button></div>'
+ (CAL_OK ? '' : '<div class="hint" style="margin-bottom:8px">Couldn\'t reach the calendar right now. Press Reload data to retry.</div>')
+ '<div class="mc">';
['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function(d){ h += '<div class="mc-dow">'+d+'</div>'; });
for (var i = 0; i < first; i++) h += '<div class="mc-day off"></div>';
for (var d = 1; d <= days; d++) {
var ds = ymd(new Date(y, m, d));
h += '<div class="mc-day'+(ds===TODAY?' today':'')+'"><div class="mc-n">'+d+'</div>'+items(ds)+'</div>';
}
return h + '</div><div class="legend" style="margin-top:8px"><span><i style="background:#fdf0d8"></i>Requested</span><span><i style="background:#e6f4ea"></i>Scheduled</span><span><i style="background:#e9e6ea"></i>Date passed</span></div>';
}
function shiftMonth(n) { MCAL = new Date(MCAL.getFullYear(), MCAL.getMonth()+n, 1); drawMonth(); }
function drawMonth() { var el = document.getElementById('monthGrid'); if (el) el.innerHTML = monthGridHTML(); }

var LIST = { type: 'eblast', past: false };
function trackerHTML() {
return '<div class="card"><div class="card-title">Calendar by Date</div>'
+'<div class="hint" style="margin-bottom:12px">Read-only. Approve, reject and release in the Sponsors tab.</div>'
+'<div class="tabs"><button class="tab" id="tab-eblast" onclick="setTab(\'eblast\')">Eblasts</button>'
+'<button class="tab" id="tab-story" onclick="setTab(\'story\')">Stories</button>'
+'<button class="tab" id="tab-past" onclick="togglePast()">Show past</button></div>'
+'<div id="tracker"><div class="hint">Loading&hellip;</div></div></div>';
}
function setTab(t) { LIST.type = t; drawTracker(); }
function togglePast() { LIST.past = !LIST.past; drawTracker(); }
function drawTracker() {
var el = document.getElementById('tracker');
if (!el) return;
['eblast','story'].forEach(function(t){ document.getElementById('tab-'+t).className = 'tab' + (LIST.type===t?' on':''); });
document.getElementById('tab-past').className = 'tab' + (LIST.past?' on':'');
var rows = CAL[LIST.type].filter(function(r){ return (r.sponsors || r.status) && (LIST.past || r.date >= DATE_MIN); })
.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
if (!rows.length) { el.innerHTML = '<div class="hint">'+(CAL_OK ? 'No '+(LIST.type==='story'?'story':'eblast')+' requests yet.' : 'Couldn\'t reach the calendar backend.')+'</div>'; return; }
el.innerHTML = rows.map(function(r){
var st = isLocked(r.status) ? (r.status==='blocked'?'blocked':'booked') : 'requested';
var names = r.sponsors ? r.sponsors.split(',').map(function(x){ return x.trim(); }).filter(Boolean) : [];
var ranks = {};
(r.notes||'').split(';').forEach(function(n){ var m = n.trim().match(/^(.*) #(\w+)$/); if (m) ranks[m[1]] = m[2]; });
var sp = names.map(function(n){ return '<span class="spn">'+esc(n)+(ranks[n] && st==='requested' ? ' <span style="color:var(--muted)">#'+esc(ranks[n])+'</span>' : '')+'</span>'; }).join('')
+ (st !== 'requested' && r.notes ? '<span class="hint">'+esc(r.notes)+'</span>' : '');
return '<div class="trow"><div class="trow-top"><span class="trow-date">'+fmtDate(r.date)+'</span>'
+'<span class="st st-'+st+'">'+st+'</span></div><div class="trow-sp">'+sp+'</div></div>';
}).join('');
}

function obligationsHTML() {
return '<div class="card"><div class="card-title">Sponsor Obligations &amp; Calendar</div>'
+'<div class="ob-sub"><b>Owed</b> comes from the Obligations sheet. <b>Status</b> comes live from the date calendar and the tracker. Click a yellow <b>Req</b> date to approve it; that locks it for everyone else. Click its <b>&#10005;</b> to reject it, optionally proposing another date. Click any item status (E1, S1, SO1&hellip;) to change it and its date; the automatic status check won&rsquo;t override your change for 5 days. Click a scheduled date twice to release it.</div>'
+'<div id="keyPanel"></div><div id="obPending"></div>'
+'<div class="stats" id="obStats"></div>'
+'<div class="ob-bar"><input class="ob-search" placeholder="Search sponsor, contact, email&hellip;" oninput="searchOb(this.value)"/>'
+'<button class="fchip" onclick="refreshAll()" title="Reloads sponsors, dates and statuses from the sheets">Reload data</button></div>'
+'<div class="ob-bar gen"><span class="gen-l">New sponsor link</span><input id="inS" class="ob-search" placeholder="Sponsor name"/><input id="inD" class="ob-search" placeholder="Drive folder URL"/><button class="fchip on" onclick="generate()">Generate</button><span id="outUrl" class="gen-out"></span></div>'
+'<div class="msg" id="msg-ob"></div>'
+'<div class="tabs" style="margin-top:6px"><button class="tab on" id="vt-s" onclick="showView(\'s\')">Sponsors</button><button class="tab" id="vt-c" onclick="showView(\'c\')">Calendar</button></div>'
+'<div class="ob-bar" id="obChips"></div>'
+'<div id="view-s"><div class="ob-wrap"><table class="ob"><thead><tr><th>Sponsor</th><th>Tier</th><th>Client Custom Page</th><th>Client email</th><th>Eblast</th><th>Social</th><th>Notes</th></tr></thead>'
+'<tbody id="obBody"></tbody></table></div>' + logHTML() + '</div>'
+'<div id="view-c" style="display:none"><div id="monthGrid"></div>' + trackerHTML() + '</div>'
+'<div class="ob-foot">Orange bar = needs a decision. Click a sponsor name to open their Drive folder. Asset Link = opens their Drive asset folder. [Sponsor] Hub = copies the client\'s hub link to share (their package, upload folder and date requests). Email Draft = creates the Gmail draft.</div>'
+'</div>';
}
function showView(v) {
document.getElementById('view-s').style.display = v==='s' ? '' : 'none';
document.getElementById('view-c').style.display = v==='c' ? '' : 'none';
document.getElementById('vt-s').className = 'tab' + (v==='s'?' on':'');
document.getElementById('vt-c').className = 'tab' + (v==='c'?' on':'');
document.getElementById('obChips').style.display = v==='s' ? '' : 'none';
}
function saveKey(v) { ADMIN.key = v.trim(); try { localStorage.setItem('ppAdminKey', ADMIN.key); } catch (e) {} KEY_BUSY = true; drawKey(); refreshAll().then(function(){ KEY_BUSY = false; drawKey(); }); }
function refreshAll() {
return loadCalendar().then(drawAll, function(){ drawAll(); setMsg('ob', 'bad', 'Couldn\'t reach the calendar backend. Press Reload data to retry.'); });
}
// Clipboard copy with a fallback for browsers that block navigator.clipboard.
function copyText(btn, text) {
function done(ok) { var o = btn.textContent; btn.textContent = ok ? 'Copied!' : 'Copy failed'; setTimeout(function(){ btn.textContent = o; }, 1500); }
function legacy() {
var ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
document.body.removeChild(ta); if (!ok) window.prompt('Copy this link:', text); done(ok);
}
if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function(){ done(true); }, legacy);
else legacy();
}
function generate() {
var n = (document.getElementById('inS').value||'').trim(), d = (document.getElementById('inD').value||'').trim();
if (!n) { document.getElementById('inS').focus(); return; }
var sp = findSponsor(n), url = sp && sp.id ? sponsorLink(sp) : linkFor(n, d);
var out = document.getElementById('outUrl');
out.innerHTML = '<a href="'+esc(url)+'" target="_blank">'+esc(url)+'</a> <button class="mini mini-s" id="genCopy">Copy</button>';
document.getElementById('genCopy').onclick = function(){ copyText(this, url); };
}
function renderAdmin() {
document.body.className = 'admin';
document.getElementById('pgTitle').textContent = 'Sponsor Obligations Tracker';
document.getElementById('pgSub').textContent = 'Team view: who we owe, what we owe, and the live eblast + social calendar.';
document.getElementById('main').innerHTML = obligationsHTML() + '<div class="sec">Team</div><div class="contacts">'+contactsHTML()+'</div>';
drawAll();
refreshAll();
}

(function(){
var p = getParams();
if (p.key) bootHub(p); else renderAdmin();
})();
</script>
