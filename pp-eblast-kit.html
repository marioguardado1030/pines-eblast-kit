<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PP2026 Sponsor Eblast Kit</title>
<style>
:root{--pink:#d31876;--gray:#444;--light:#faf5f8;--border:#e8d0dc;--muted:#888}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--light);color:#2a2a2a;min-height:100vh}
.hdr{background:var(--pink);color:#fff;padding:30px 28px 24px}
.hdr-in{max-width:580px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-bottom:8px}
h1{font-size:26px;font-weight:700}
.hdr-sub{font-size:13px;opacity:.8;margin-top:5px}
.chip{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;margin-top:12px}
.main{max-width:580px;margin:0 auto;padding:30px 24px 60px}
.steps{display:flex;flex-direction:column;gap:14px}
.step{background:#fff;border:1px solid var(--border);border-radius:12px;padding:22px;display:flex;gap:16px}
.num{width:34px;height:34px;border-radius:50%;background:var(--pink);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.step h2{font-size:15px;font-weight:700;margin-bottom:4px}
.step p{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;width:100%;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-pink{background:var(--pink);color:#fff}
.btn-outline{background:#fff;color:var(--pink);border:2px solid var(--pink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.sec{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.contacts{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.crow{display:flex;align-items:center;gap:12px}
.av{width:32px;height:32px;border-radius:50%;background:var(--pink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ci strong{display:block;font-size:13px;font-weight:700}
.ci a{font-size:12px;color:var(--pink);text-decoration:none}
.ci a:hover{text-decoration:underline}
.cc{font-size:10px;color:var(--muted);background:#f2eef1;border-radius:4px;padding:1px 6px;margin-left:4px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:14px}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--pink);margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:5px}
.field input{width:100%;border:1.5px solid #ddd;border-radius:7px;padding:10px 12px;font-size:14px;color:#2a2a2a;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--pink)}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.abtn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;padding:11px 18px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;transition:opacity .15s}
.abtn:hover{opacity:.85}
.abtn-p{background:var(--pink);color:#fff}
.abtn-s{background:#fff;color:var(--gray);border:1.5px solid #ddd}
.out{background:#fff9fb;border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:16px;display:none}
.out-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
.out-url{font-size:12px;color:var(--pink);word-break:break-all;background:#fff;border:1px solid var(--border);border-radius:5px;padding:8px 10px;margin-bottom:10px;font-family:monospace}
.cbtn{background:var(--pink);color:#fff;border:none;border-radius:5px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer}
.cbtn:hover{opacity:.85}
.err{background:#fff4f4;border:1px solid #f0d0d0;border-radius:8px;padding:12px 14px;font-size:13px;color:#c0304a}
.directory{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.drow-name{font-size:13px;font-weight:700}
.tier{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-left:7px;vertical-align:middle}
.tier-platinum{background:#e4e8ee;color:#48566b}
.tier-gold{background:#f2e8d2;color:#a1791f}
.tier-silver{background:#eae7e0;color:#847e73}
.tier-bronze{background:#f0e2d6;color:#8a5837}
.tier-community{background:#eceae4;color:#8a887f}
.drow-actions{display:flex;gap:6px;flex-shrink:0}
.mini{font-size:11.5px;font-weight:700;border:none;border-radius:6px;padding:7px 11px;cursor:pointer;text-decoration:none;white-space:nowrap}
.mini-p{background:var(--pink);color:#fff}
.mini-s{background:#f2eef1;color:var(--gray)}
.dates{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.date-opt{display:flex;align-items:center;gap:10px;background:#fff9fb;border:1.5px solid var(--border);border-radius:9px;padding:12px 14px;cursor:pointer}
.date-opt input{width:17px;height:17px;accent-color:var(--pink)}
.date-opt span{font-size:13.5px;font-weight:600}
.date-count{font-size:11px;color:var(--muted);margin-bottom:12px}
</style>
</head>
<body>

<div class="hdr">
<div class="hdr-in">
<div class="eyebrow">Pines Party 2026 &mdash; Fire Island Pines</div>
<h1 id="pgTitle">Sponsor Eblast Kit</h1>
<div class="hdr-sub" id="pgSub">Post-event eblast system for PP2026 sponsors.</div>
<div id="pgChip" class="chip" style="display:none"></div>
</div>
</div>

<div class="main" id="main"></div>

<script>
// Kit folder (writing guide, template, example) — shared by every sponsor
var KIT = 'https://drive.google.com/drive/folders/1f-x19JB9m2c3_YA4Ia2f7_in78xCXDcT?usp=drive_link';

var TEAM = [
{n:'Mario Guardado', e:'mario.guardado@pinesparty.com', i:'MG', cc:false},
{n:'Tim Dejsiriudom', e:'tdejsiriudom@pinesparty.com', i:'TD', cc:true},
{n:'Tejesh Mistry', e:'tj@pinesparty.com', i:'TM', cc:true}
];

// Sponsors pick from any date in this window — requests go to the team by
// email for manual approval (no live conflict-checking yet; that needs the
// Apps Script backend deployed as a Web App, still pending).
var DATE_MIN = new Date().toISOString().slice(0,10);
var DATE_MAX = '2027-06-30';
var MAX_EBLAST_DATES = 4;
var MAX_STORY_DATES = 2;

// Real sponsor Drive upload folders — sourced directly from the authoritative
// Drive tree: Sponsorships > Sponsor By Sponsorship Level > {TIER} SPONSORS,
// one subfolder per sponsor. All 34 confirmed, no flags.
var SPONSORS = [
{n:'Gilead Sciences', t:'platinum', id:'1QgyQBLodMU1LW_FaLO34rhWBj_FPyzC0'},
{n:'JustFor.Fans', t:'platinum', id:'1q_BjGHOTjjzb7Av_na2ojXCJWRiVf_lm'},
{n:'Tryst Hospitality / MISTR', t:'platinum', id:'1a7AmqcYD71xkAWtH9P1W69pNdtRMHZpw'},
{n:'Visit Lauderdale', t:'platinum', id:'1g8_VjxtvT3PhJQUosA5JNnE8KvHWrRKP'},
{n:'Cuervo', t:'gold', id:'1fW3GFed8xRZDv-FDAgqSUitn0zELloP7'},
{n:'High Noon (Gallo) / Lucky One Lemonade', t:'gold', id:'10Ycudgq3dHywAhEUASuEnHyLd5innEI5'},
{n:'New Amsterdam Vodka', t:'gold', id:'1NSfPgmwPCKIXTq9cGgO63iWwsq4HL1Ja'},
{n:'Identiti Financial', t:'gold', id:'1RUZKX4S3KUtrvkBmgg6_N_jQJq3cwpSM'},
{n:'Pines Harbor Realty', t:'gold', id:'1fbIeaayTS8qnYIX16KfdGpnshzz4220o'},
{n:'Poxeidon', t:'gold', id:'1Uzci9tYIVzSDjB2jhgfbehyXwnDICRbB'},
{n:'Boardwalk Etiquette', t:'gold', id:'1XNznMEimyhEaKhKQP24Nty7CG3MnGH-6'},
{n:'H2O', t:'gold', id:'1VrHZJ6zpPE4w3XZjjR4vKeujKFllND5p'},
{n:'Jeff Wan', t:'gold', id:'1I_aqoNmhf594MxYsx9i_VIEvfov9stjW'},
{n:'Swiss Air', t:'gold', id:'1Eiy2SxARTvnmqrUc7sEAA8rRKE1JGQTk'},
{n:'Threadcount', t:'gold', id:'1g7YS9VU9cGiB72nG2dJkdt05GUiK8iVL'},
{n:'ViiV Healthcare', t:'gold', id:'1cFAsKpytVsi0ALvkmQ-fgwrx11tMlEip'},
{n:'Chris Turk', t:'silver', id:'1_b6z9cqDHBJz8162bfj4JleFCPcsCM6j'},
{n:'Bekin', t:'silver', id:'1a1MzqRmsU-MI-XUdG_7yDSsFWmP0xXrN'},
{n:'Long Island Cannabis Club', t:'silver', id:'1ptGvJpZzJnC6m2Bg7L2F_3WGwTT-n_Gt'},
{n:'LUXY Ride', t:'silver', id:'1cOTuv1R3mvXDT-z-DFg1UwCQsgntBqBi'},
{n:'Brownie', t:'silver', id:'1AltkEpnUZ9EpyfZxJdk1Qds94U4Djcbk'},
{n:'PUMP!', t:'silver', id:'1Lt3EqKrjg8ZLeGafs0tABovxNm6DiYkz'},
{n:'Vinnie Petrarca Fire Island Real Estate', t:'silver', id:'14re68NevJjlTiVkeKnW18t90-pGU90Rm'},
{n:'HOWL', t:'silver', id:'1zmMYDX7Y22Flkq3o8NTZaP2uFCXGjhFu'},
{n:'LAFCO New York', t:'silver', id:'1O9jBoETOOtgT6rbZjYvbO7jF93dBI-Ea'},
{n:'Red Bull', t:'bronze', id:'1792YbwaATjDCbSAKyLVamezWRVoRUw1V'},
{n:'GMHC', t:'bronze', id:'1Z7aaR372gjgizYHieNcNZaPMEmDjCkt7'},
{n:'Davis Park Harbor Store', t:'bronze', id:'1nPEVMgioVkv5XPY8mg652iQGPP5L-x5S'},
{n:'Guesthouse Lost River', t:'bronze', id:'1yrOeW-G-4HSfemc_WhakwQdIG2_-8oza'},
{n:'Sip n Twirl', t:'bronze', id:'1Vz3XtpK-WXyFRRV1OI8JyG2hp-0_ZsJ7'},
{n:'Mark Allen', t:'bronze', id:'1buqWlOZtCRZqlLYpT0yJ5oCRVabr1xvH'},
{n:'Curious Elixirs', t:'bronze', id:'1xWXq4UnCZGMXhsQkGEFvqmCg1C7gevG9'},
{n:'The Dunes', t:'bronze', id:'1HgBnkxgJGH5cGUPDkih43FB3UUYpScSS'},
{n:'Li-Lac Chocolates', t:'bronze', id:'1f3sPB3ARmgBTKT5QhEokpqdwObhrArme'},
{n:'Pines Club', t:'bronze', id:'164TlekZQ2OJu_pGf70JT8_SJsesq7GEw'},
{n:'The Owen-Micchane Family', t:'community', id:'10BZLSzZYBUns8sG_vwWlSZIRP82sFTC4'}
];

var TIER_LABEL = {platinum:'Platinum', gold:'Gold', silver:'Silver', bronze:'Bronze', community:'Community'};

function getParams() {
var p = new URLSearchParams(window.location.search);
return {sponsor: p.get('sponsor')||'', drive: p.get('drive')||''};
}

function contactsHTML() {
return TEAM.map(function(c){
return '<div class="crow"><div class="av">'+c.i+'</div><div class="ci">'
+'<strong>'+c.n+(c.cc?'<span class="cc">CC</span>':'')+'</strong>'
+'<a href="mailto:'+c.e+'">'+c.e+'</a></div></div>';
}).join('');
}

function driveUrl(id) { return 'https://drive.google.com/drive/folders/'+id; }

function linkFor(name, driveLink) {
return window.location.origin + window.location.pathname
+ '?sponsor=' + encodeURIComponent(name)
+ (driveLink ? '&drive=' + encodeURIComponent(driveLink) : '');
}

function renderClient(sponsor, drive) {
document.getElementById('pgTitle').textContent = sponsor + ' - Eblast Kit';
document.getElementById('pgSub').textContent = 'Your post-event eblast assets for Pines Party 2026.';
var chip = document.getElementById('pgChip');
chip.textContent = sponsor;
chip.style.display = 'inline-block';

var uploadHTML = drive
? '<a class="btn btn-pink" href="'+encodeURI(drive)+'" target="_blank">Upload Your Assets &rarr;</a>'
: '<div class="err">Upload folder not set. Contact <a href="mailto:mario.guardado@pinesparty.com" style="color:#c0304a">Mario</a> for your link.</div>';

function dateInputsHTML(prefix, count) {
var out = '';
for (var i = 1; i <= count; i++) {
out += '<div class="field"><label>Choice '+i+(i===1?' (required)':' (optional)')+'</label>'
+ '<input type="date" class="'+prefix+'Date" min="'+DATE_MIN+'" max="'+DATE_MAX+'"'+(i===1?' required':'')+'/></div>';
}
return out;
}

document.getElementById('main').innerHTML =
'<div class="steps">'
+'<div class="step"><div class="num">1</div><div>'
+'<h2>Open the Kit</h2>'
+'<p>Your kit includes a writing guide, blank template, and completed example &mdash; everything you need to prepare your eblast copy.</p>'
+'<a class="btn btn-outline" href="'+KIT+'" target="_blank">Open Kit Folder &rarr;</a>'
+'</div></div>'
+'<div class="step"><div class="num">2</div><div>'
+'<h2>Upload Your Assets</h2>'
+'<p>Upload your logo, 1-2 photos, and completed copy template to your sponsor folder. We\'ll take it from there.</p>'
+uploadHTML
+'</div></div>'
+'<div class="step"><div class="num">3</div><div>'
+'<h2>Request Your Eblast Send Date</h2>'
+'<p>Give us up to '+MAX_EBLAST_DATES+' dates that work, ranked in order of preference. We\'ll confirm the one we assign by email &mdash; a submitted date is a request, not a booking.</p>'
+dateInputsHTML('eblast', MAX_EBLAST_DATES)
+'<button class="btn btn-pink" onclick="requestDates(\''+sponsor.replace(/'/g, "\\'")+'\', \'eblast\')">Request Eblast Date(s) &rarr;</button>'
+'</div></div>'
+'<div class="step"><div class="num">4</div><div>'
+'<h2>Request a Social Story / Shoutout Slot</h2>'
+'<p>Optional. Give us up to '+MAX_STORY_DATES+' dates you\'d like your Instagram story or shoutout to go out &mdash; during the eblast send window or another priority time.</p>'
+dateInputsHTML('story', MAX_STORY_DATES)
+'<button class="btn btn-outline" onclick="requestDates(\''+sponsor.replace(/'/g, "\\'")+'\', \'story\')">Request Story Slot(s) &rarr;</button>'
+'</div></div>'
+'</div>'
+'<div class="sec">Questions? Contact us</div>'
+'<div class="contacts">'+contactsHTML()+'</div>';
}

function requestDates(sponsor, kind) {
var inputs = Array.prototype.slice.call(document.querySelectorAll('.'+kind+'Date'));
var picked = inputs.map(function(i){ return i.value; }).filter(Boolean);
if (!picked.length) { if (inputs[0]) inputs[0].focus(); return; }
var label = kind === 'story' ? 'Social Story/Shoutout' : 'Eblast Send Date';
var to = TEAM[0].e;
var cc = TEAM.filter(function(t){ return t.cc; }).map(function(t){ return t.e; }).join(',');
var subject = 'PP2026 ' + label + ' Request \u2014 ' + sponsor;
var body = sponsor + ' would like to request the following ' + label.toLowerCase() + '(s), in order of preference:\n\n'
+ picked.map(function(d, i){ return (i+1) + '. ' + d; }).join('\n')
+ '\n\nPlease confirm which date works.';
var mailto = 'mailto:' + encodeURIComponent(to) + '?cc=' + encodeURIComponent(cc)
+ '&subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
window.location.href = mailto;
}

function directoryHTML() {
return SPONSORS.map(function(s){
var link = linkFor(s.n, driveUrl(s.id));
return '<div class="drow">'
+'<div class="drow-name">'+s.n+'<span class="tier tier-'+s.t+'">'+TIER_LABEL[s.t]+'</span></div>'
+'<div class="drow-actions">'
+'<button class="mini mini-p" onclick="copyDirect(this,\''+link.replace(/'/g, "\\'")+'\')">Copy Link</button>'
+'<a class="mini mini-s" href="'+driveUrl(s.id)+'" target="_blank">Drive</a>'
+'</div></div>';
}).join('');
}

function copyDirect(btn, url) {
navigator.clipboard.writeText(url).then(function(){
var orig = btn.textContent;
btn.textContent = 'Copied!';
setTimeout(function(){ btn.textContent = orig; }, 1500);
});
}

function renderAdmin() {
document.getElementById('main').innerHTML =
'<div class="card"><div class="card-title">Sponsor Directory ('+SPONSORS.length+')</div>'
+'<div class="hint" style="margin-bottom:12px">Confirmed sponsors with a live Drive upload folder. Copy a sponsor\'s link and send it to them directly.</div>'
+'<div class="directory">'+directoryHTML()+'</div>'
+'</div>'
+'<div class="card"><div class="card-title">Generate Custom Link</div>'
+'<div class="hint" style="margin-bottom:14px">For a sponsor not yet in the directory above, or one flagged for a folder mismatch.</div>'
+'<div class="field"><label>Sponsor Name</label>'
+'<input id="inS" type="text" placeholder="e.g. Chris Turk"/>'
+'</div>'
+'<div class="field"><label>Sponsor Upload Folder (Google Drive URL)</label>'
+'<input id="inD" type="text" placeholder="https://drive.google.com/drive/folders/..."/>'
+'</div>'
+'<div class="row">'
+'<button class="abtn abtn-p" onclick="generate()">Generate Link</button>'
+'<a class="abtn abtn-s" href="'+KIT+'" target="_blank">Open Kit Folder</a>'
+'</div>'
+'<div class="out" id="out">'
+'<div class="out-lbl">Shareable Sponsor Link</div>'
+'<div class="out-url" id="outUrl"></div>'
+'<button class="cbtn" onclick="copyLink()">Copy Link</button>'
+'</div>'
+'</div>'
+'<div class="sec">Team</div>'
+'<div class="contacts">'+contactsHTML()+'</div>';
}

function generate() {
var s = (document.getElementById('inS').value||'').trim();
var d = (document.getElementById('inD').value||'').trim();
if (!s) { document.getElementById('inS').focus(); return; }
var url = linkFor(s, d);
document.getElementById('outUrl').textContent = url;
document.getElementById('out').style.display = 'block';
}

function copyLink() {
var url = document.getElementById('outUrl').textContent;
navigator.clipboard.writeText(url).then(function(){
var b = document.querySelector('#out .cbtn');
b.textContent = 'Copied!';
setTimeout(function(){ b.textContent = 'Copy Link'; }, 2000);
});
}

(function(){
var p = getParams();
if (p.sponsor) renderClient(p.sponsor, p.drive);
else renderAdmin();
})();
</script>
</body>
</html>
