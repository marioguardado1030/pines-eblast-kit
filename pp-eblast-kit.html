<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PP2026 Sponsor Eblast Kit</title>
<style>
:root{--pink:#d31876;--gray:#444;--light:#faf5f8;--border:#e8d0dc;--muted:#888}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--light);color:#2a2a2a;min-height:100vh}
.hdr{background:var(--pink);color:#fff;padding:30px 28px 24px}
.hdr-in{max-width:580px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-bottom:8px}
h1{font-size:26px;font-weight:700}
.hdr-sub{font-size:13px;opacity:.8;margin-top:5px}
.chip{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;margin-top:12px}
.main{max-width:580px;margin:0 auto;padding:30px 24px 60px}
.steps{display:flex;flex-direction:column;gap:14px}
.step{background:#fff;border:1px solid var(--border);border-radius:12px;padding:22px;display:flex;gap:16px}
.num{width:34px;height:34px;border-radius:50%;background:var(--pink);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.step h2{font-size:15px;font-weight:700;margin-bottom:4px}
.step p{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;width:100%;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-pink{background:var(--pink);color:#fff}
.btn-outline{background:#fff;color:var(--pink);border:2px solid var(--pink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.sec{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.contacts{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.crow{display:flex;align-items:center;gap:12px}
.av{width:32px;height:32px;border-radius:50%;background:var(--pink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ci strong{display:block;font-size:13px;font-weight:700}
.ci a{font-size:12px;color:var(--pink);text-decoration:none}
.ci a:hover{text-decoration:underline}
.cc{font-size:10px;color:var(--muted);background:#f2eef1;border-radius:4px;padding:1px 6px;margin-left:4px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:14px}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--pink);margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:5px}
.field input{width:100%;border:1.5px solid #ddd;border-radius:7px;padding:10px 12px;font-size:14px;color:#2a2a2a;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--pink)}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.abtn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;padding:11px 18px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;transition:opacity .15s}
.abtn:hover{opacity:.85}
.abtn-p{background:var(--pink);color:#fff}
.abtn-s{background:#fff;color:var(--gray);border:1.5px solid #ddd}
.out{background:#fff9fb;border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:16px;display:none}
.out-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
.out-url{font-size:12px;color:var(--pink);word-break:break-all;background:#fff;border:1px solid var(--border);border-radius:5px;padding:8px 10px;margin-bottom:10px;font-family:monospace}
.cbtn{background:var(--pink);color:#fff;border:none;border-radius:5px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer}
.cbtn:hover{opacity:.85}
.err{background:#fff4f4;border:1px solid #f0d0d0;border-radius:8px;padding:12px 14px;font-size:13px;color:#c0304a}
.directory{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.drow-name{font-size:13px;font-weight:700}
.tier{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-left:7px;vertical-align:middle}
.tier-platinum{background:#e4e8ee;color:#48566b}
.tier-gold{background:#f2e8d2;color:#a1791f}
.tier-silver{background:#eae7e0;color:#847e73}
.tier-bronze{background:#f0e2d6;color:#8a5837}
.tier-community{background:#eceae4;color:#8a887f}
.drow-actions{display:flex;gap:6px;flex-shrink:0}
.mini{font-size:11.5px;font-weight:700;border:none;border-radius:6px;padding:7px 11px;cursor:pointer;text-decoration:none;white-space:nowrap}
.mini-p{background:var(--pink);color:#fff}
.mini-s{background:#f2eef1;color:var(--gray)}
.dates{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.date-opt{display:flex;align-items:center;gap:10px;background:#fff9fb;border:1.5px solid var(--border);border-radius:9px;padding:12px 14px;cursor:pointer}
.date-opt input{width:17px;height:17px;accent-color:var(--pink)}
.date-opt span{font-size:13.5px;font-weight:600}
.date-count{font-size:11px;color:var(--muted);margin-bottom:12px}

.cal{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;background:#fff}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-hd strong{font-size:14px}
.cal-nav{background:#f2eef1;border:none;border-radius:6px;width:30px;height:30px;font-size:16px;cursor:pointer;color:var(--gray)}
.cal-nav[disabled]{opacity:.35;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:10px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.cal-day{position:relative;border:none;background:#fff9fb;border-radius:6px;height:36px;font-size:13px;font-weight:600;color:#2a2a2a;cursor:pointer}
.cal-day:hover{outline:1.5px solid var(--pink)}
.cal-day.off{background:transparent;color:#ccc;cursor:default;outline:none}
.cal-day.taken{background:#eee;color:#aaa;text-decoration:line-through;cursor:not-allowed;outline:none}
.cal-day.mine{background:#e6f4ea;color:#1e7a3a}
.cal-day.sel{background:var(--pink);color:#fff}
.cal-day .rk{position:absolute;top:1px;right:3px;font-size:9px;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:4px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.picked{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pchip{background:#fff;border:1.5px solid var(--pink);color:var(--pink);border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700}
.pchip button{background:none;border:none;color:var(--pink);font-weight:700;cursor:pointer;margin-left:4px}
.msg{font-size:12.5px;border-radius:8px;padding:10px 12px;margin-top:10px;display:none}
.msg.ok{display:block;background:#eef8f1;border:1px solid #cfe9d6;color:#1e7a3a}
.msg.bad{display:block;background:#fff4f4;border:1px solid #f0d0d0;color:#c0304a}
.msg.info{display:block;background:#f6f3f5;border:1px solid var(--border);color:var(--gray)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{border:1.5px solid var(--border);background:#fff;border-radius:7px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--gray)}
.tab.on{background:var(--pink);border-color:var(--pink);color:#fff}
.trow{border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#fff}
.trow-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trow-date{font-size:13px;font-weight:700}
.st{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:5px}
.st-requested{background:#fdf0d8;color:#9a6a12}
.st-booked{background:#e6f4ea;color:#1e7a3a}
.st-blocked{background:#eee;color:#777}
.trow-sp{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.spn{font-size:12px;background:#f7f3f6;border-radius:6px;padding:4px 8px}
</style>
</head>

<div class="main" id="main"></div>

<script>
// Kit folder (writing guide, template, example) — shared by every sponsor
var KIT = 'https://drive.google.com/drive/folders/1f-x19JB9m2c3_YA4Ia2f7_in78xCXDcT?usp=drive_link';

function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
var DATE_MIN = ymd(new Date());
var DATE_MAX = '2027-06-30';
var MAX_EBLAST_DATES = 4;
var MAX_STORY_DATES = 2;

// Real sponsor Drive upload folders — sourced directly from the authoritative
// Drive tree: Sponsorships > Sponsor By Sponsorship Level > {TIER} SPONSORS,
// one subfolder per sponsor. All 34 confirmed, no flags.
var SPONSORS = [
{n:'Gilead Sciences', t:'platinum', id:'1QgyQBLodMU1LW_FaLO34rhWBj_FPyzC0'},
{n:'JustFor.Fans', t:'platinum', id:'1q_BjGHOTjjzb7Av_na2ojXCJWRiVf_lm'},
{n:'Tryst Hospitality / MISTR', t:'platinum', id:'1a7AmqcYD71xkAWtH9P1W69pNdtRMHZpw'},
{n:'Visit Lauderdale', t:'platinum', id:'1g8_VjxtvT3PhJQUosA5JNnE8KvHWrRKP'},
{n:'Cuervo', t:'gold', id:'1fW3GFed8xRZDv-FDAgqSUitn0zELloP7'},
{n:'High Noon (Gallo) / Lucky One Lemonade', t:'gold', id:'10Ycudgq3dHywAhEUASuEnHyLd5innEI5'},
{n:'New Amsterdam Vodka', t:'gold', id:'1NSfPgmwPCKIXTq9cGgO63iWwsq4HL1Ja'},
{n:'Identiti Financial', t:'gold', id:'1RUZKX4S3KUtrvkBmgg6_N_jQJq3cwpSM'},
{n:'Pines Harbor Realty', t:'gold', id:'1fbIeaayTS8qnYIX16KfdGpnshzz4220o'},
{n:'Poxeidon', t:'gold', id:'1Uzci9tYIVzSDjB2jhgfbehyXwnDICRbB'},
{n:'Boardwalk Etiquette', t:'gold', id:'1XNznMEimyhEaKhKQP24Nty7CG3MnGH-6'},
{n:'H2O', t:'gold', id:'1VrHZJ6zpPE4w3XZjjR4vKeujKFllND5p'},

{n:'Chris Turk', t:'silver', id:'1_b6z9cqDHBJz8162bfj4JleFCPcsCM6j'},
{n:'Bekin', t:'silver', id:'1a1MzqRmsU-MI-XUdG_7yDSsFWmP0xXrN'},

{n:'LUXY Ride', t:'silver', id:'1cOTuv1R3mvXDT-z-DFg1UwCQsgntBqBi'},
{n:'Brownie', t:'silver', id:'1AltkEpnUZ9EpyfZxJdk1Qds94U4Djcbk'},
{n:'PUMP!', t:'silver', id:'1Lt3EqKrjg8ZLeGafs0tABovxNm6DiYkz'},
{n:'Vinnie Petrarca Fire Island Real Estate', t:'silver', id:'14re68NevJjlTiVkeKnW18t90-pGU90Rm'},
{n:'HOWL', t:'silver', id:'1zmMYDX7Y22Flkq3o8NTZaP2uFCXGjhFu'},
{n:'LAFCO New York', t:'silver', id:'1O9jBoETOOtgT6rbZjYvbO7jF93dBI-Ea'},
{n:'Red Bull', t:'bronze', id:'1792YbwaATjDCbSAKyLVamezWRVoRUw1V'},
{n:'GMHC', t:'bronze', id:'1Z7aaR372gjgizYHieNcNZaPMEmDjCkt7'},

{n:'Pines Club', t:'bronze', id:'164TlekZQ2OJu_pGf70JT8_SJsesq7GEw'},
{n:'The Owen-Micchane Family', t:'community', id:'10BZLSzZYBUns8sG_vwWlSZIRP82sFTC4'}

var TIER_LABEL = {platinum:'Platinum', gold:'Gold', silver:'Silver', bronze:'Bronze', community:'Community'};

function slug(name) { return name.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function findSponsor(key) {
for (var i = 0; i < SPONSORS.length; i++) if (slug(SPONSORS[i].n) === slug(key)) return SPONSORS[i];
return null;
}

// Sponsor page: ?s=<slug> (drive folder comes from the registry above).
// Old ?sponsor=&drive= links still work.
function getParams() {
var p = new URLSearchParams(window.location.search);
var key = p.get('s') || p.get('sponsor') || '';
var reg = key ? findSponsor(key) : null;
if (reg) return {sponsor: reg.n, drive: driveUrl(reg.id)};
return {sponsor: p.get('sponsor')||'', drive: p.get('drive')||''};
}

function contactsHTML() {
return TEAM.map(function(c){
return '<div class="crow"><div class="av">'+c.i+'</div><div class="ci">'
+'<strong>'+c.n+(c.cc?'<span class="cc">CC</span>':'')+'</strong>'
+'<a href="mailto:'+c.e+'">'+c.e+'</a></div></div>';
}).join('');
}

function driveUrl(id) { return 'https://drive.google.com/drive/folders/'+id; }

function sponsorLink(name) {
return window.location.origin + window.location.pathname + '?s=' + slug(name);
}

function linkFor(name, driveLink) {
return window.location.origin + window.location.pathname
+ '?sponsor=' + encodeURIComponent(name)
+ (driveLink ? '&drive=' + encodeURIComponent(driveLink) : '');
}

// ---------- Backend ----------
var CAL = { eblast: [], story: [] }, CAL_OK = false;

// Reads: GET with a timeout and one retry.
function getJSON(ms) {
var ctl = window.AbortController ? new AbortController() : null;
var t = setTimeout(function(){ if (ctl) ctl.abort(); }, ms);
return fetch(GAS_URL + '?_t=' + Date.now(), ctl ? {signal: ctl.signal} : {})
.then(function(r){ clearTimeout(t); return r.json(); });
}
function loadCalendar() {
return getJSON(20000).catch(function(){ return getJSON(20000); })
.then(function(d){
if (!d || !d.rows) throw new Error((d && d.error) || 'Bad response');
CAL.eblast = d.rows || []; CAL.story = d.story || []; CAL_OK = true;
return CAL;
});
}

// Writes: fire-and-forget (no-cors). Apps Script's POST reply redirect is
// unreliable in browsers, so every write is confirmed by re-reading the sheet.
function post(params) {
var body = Object.keys(params).map(function(k){
return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
}).join('&');
return fetch(GAS_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body});
}
function sleep(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }
// Re-read until check(CAL) passes (or give up after ~15s).
function confirmWrite(check) {
var tries = 0;
function go() {
return loadCalendar().then(function(){
if (check()) return true;
if (++tries >= 4) return false;
return sleep(2500).then(go);
});
}
return sleep(1200).then(go);
}

function isLocked(st) { return st === 'booked' || st === 'approved' || st === 'blocked'; }
function rowFor(type, date) {
var rows = CAL[type];
for (var i = 0; i < rows.length; i++) if (rows[i].date === date) return rows[i];
return null;
}
function hasSponsor(row, name) {
return row && row.sponsors.split(',').map(function(x){ return x.trim(); }).indexOf(name) !== -1;
}
function fmtDate(s) {
var p = s.split('-');
return new Date(+p[0], +p[1]-1, +p[2]).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
}
function esc(s) { return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

// ---------- Client view ----------
var PICK = { eblast: [], story: [] };
var VIEW = { eblast: null, story: null };
var SPONSOR = '';
var MAXP = { eblast: MAX_EBLAST_DATES, story: MAX_STORY_DATES };

function renderClient(sponsor, drive) {
SPONSOR = sponsor;
document.getElementById('pgTitle').textContent = sponsor + ' - Eblast Kit';
document.getElementById('pgSub').textContent = 'Your post-event eblast assets for Pines Party 2026.';
var chip = document.getElementById('pgChip');
chip.textContent = sponsor;
chip.style.display = 'inline-block';

var uploadHTML = drive
? '<a class="btn btn-pink" href="'+esc(encodeURI(drive))+'" target="_blank">Upload Your Assets &rarr;</a>'
: '<div class="err">Upload folder not set. Contact <a href="mailto:mario.guardado@pinesparty.com" style="color:#c0304a">Mario</a> for your link.</div>';

function pickerHTML(type) {
return '<div class="legend"><span><i style="background:var(--pink)"></i>Your picks</span>'
+'<span><i style="background:#e6f4ea"></i>Confirmed for you</span>'
+'<span><i style="background:#eee"></i>Unavailable</span></div>'
+'<div class="cal" id="cal-'+type+'"><div class="hint">Loading available dates&hellip;</div></div>'
+'<div class="picked" id="picked-'+type+'"></div>';
}

document.getElementById('main').innerHTML =
'<div class="steps">'
+'<div class="step"><div class="num">1</div><div style="flex:1;min-width:0">'
+'<h2>Open the Kit</h2>'
+'<p>Your kit includes a writing guide, blank template, and completed example &mdash; everything you need to prepare your eblast copy.</p>'
+'<a class="btn btn-outline" href="'+KIT+'" target="_blank">Open Kit Folder &rarr;</a>'
+'</div></div>'
+'<div class="step"><div class="num">2</div><div style="flex:1;min-width:0">'
+'<h2>Upload Your Assets</h2>'
+'<p>Upload your logo, 1-2 photos, and completed copy template to your sponsor folder. You\'ll need to be signed in to any Google account.</p>'
+uploadHTML
+'</div></div>'
+'<div class="step"><div class="num">3</div><div style="flex:1;min-width:0">'
+'<h2>Request Your Eblast Send Date</h2>'
+'<p>Tap up to '+MAX_EBLAST_DATES+' dates, in order of preference. Greyed-out dates are already taken. We\'ll confirm one date by email &mdash; a request is not a booking.</p>'
+pickerHTML('eblast')
+'<button class="btn btn-pink" id="go-eblast" onclick="submitDates(\'eblast\')">Request Eblast Date(s) &rarr;</button>'
+'<div class="msg" id="msg-eblast"></div>'
+'</div></div>'
+'<div class="step"><div class="num">4</div><div style="flex:1;min-width:0">'
+'<h2>Request a Social Story / Shoutout Slot</h2>'
+'<p>Optional. Tap up to '+MAX_STORY_DATES+' dates for your Instagram story or shoutout, in order of preference.</p>'
+pickerHTML('story')
+'<button class="btn btn-outline" id="go-story" onclick="submitDates(\'story\')">Request Story Slot(s) &rarr;</button>'
+'<div class="msg" id="msg-story"></div>'
+'</div></div>'
+'</div>'
+'<div class="sec">Questions? Contact us</div>'
+'<div class="contacts">'+contactsHTML()+'</div>';

var now = new Date();
VIEW.eblast = new Date(now.getFullYear(), now.getMonth(), 1);
VIEW.story = new Date(now.getFullYear(), now.getMonth(), 1);
loadCalendar().then(function(){
drawCal('eblast'); drawCal('story');
showExisting('eblast'); showExisting('story');
}).catch(function(){
['eblast','story'].forEach(function(t){
drawCal(t);
setMsg(t, 'bad', 'Couldn\'t load availability right now. You can still pick dates &mdash; we\'ll check for conflicts before confirming.');
});
});
}

function showExisting(type) {
var mine = CAL[type].filter(function(r){ return hasSponsor(r, SPONSOR) && r.date >= DATE_MIN; });
if (!mine.length) return;
var booked = mine.filter(function(r){ return isLocked(r.status); });
var txt = booked.length
? 'Confirmed: <strong>' + booked.map(function(r){ return fmtDate(r.date); }).join(', ') + '</strong>'
: 'Already requested: ' + mine.map(function(r){ return fmtDate(r.date); }).join(', ') + '. Submitting again updates your ranking.';
setMsg(type, booked.length ? 'ok' : 'info', txt);
}

function setMsg(type, cls, html) {
var m = document.getElementById('msg-'+type);
m.className = 'msg ' + cls; m.innerHTML = html;
}

function drawCal(type) {
var el = document.getElementById('cal-'+type);
var v = VIEW[type], y = v.getFullYear(), mo = v.getMonth();
var first = new Date(y, mo, 1).getDay(), days = new Date(y, mo+1, 0).getDate();
var minM = DATE_MIN.slice(0,7), maxM = DATE_MAX.slice(0,7), curM = ymd(v).slice(0,7);
var h = '<div class="cal-hd"><button class="cal-nav" '+(curM<=minM?'disabled':'')+' onclick="shiftCal(\''+type+'\',-1)">&lsaquo;</button>'
+'<strong>'+v.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</strong>'
+'<button class="cal-nav" '+(curM>=maxM?'disabled':'')+' onclick="shiftCal(\''+type+'\',1)">&rsaquo;</button></div>'
+'<div class="cal-grid">';
['S','M','T','W','T','F','S'].forEach(function(d){ h += '<div class="cal-dow">'+d+'</div>'; });
for (var i = 0; i < first; i++) h += '<div></div>';
for (var d = 1; d <= days; d++) {
var ds = ymd(new Date(y, mo, d)), row = rowFor(type, ds), cls = 'cal-day', dis = false, rk = '';
var idx = PICK[type].indexOf(ds);
if (ds < DATE_MIN || ds > DATE_MAX) { cls += ' off'; dis = true; }
else if (row && isLocked(row.status) && row.sponsors === SPONSOR && row.status !== 'blocked') { cls += ' mine'; dis = true; }
else if (row && isLocked(row.status)) { cls += ' taken'; dis = true; }
else if (idx !== -1) { cls += ' sel'; rk = '<span class="rk">'+(idx+1)+'</span>'; }
h += '<button class="'+cls+'" '+(dis?'disabled':'onclick="togglePick(\''+type+'\',\''+ds+'\')"')+'>'+d+rk+'</button>';
}
el.innerHTML = h + '</div>';
drawPicked(type);
}

function shiftCal(type, n) { var v = VIEW[type]; VIEW[type] = new Date(v.getFullYear(), v.getMonth()+n, 1); drawCal(type); }

function togglePick(type, ds) {
var arr = PICK[type], i = arr.indexOf(ds);
if (i !== -1) arr.splice(i, 1);
else if (arr.length >= MAXP[type]) { setMsg(type, 'bad', 'You can pick up to '+MAXP[type]+' dates. Remove one to add another.'); return; }
else arr.push(ds);
drawCal(type);
}

function drawPicked(type) {
document.getElementById('picked-'+type).innerHTML = PICK[type].map(function(ds, i){
return '<span class="pchip">#'+(i+1)+' '+fmtDate(ds)+'<button onclick="togglePick(\''+type+'\',\''+ds+'\')" aria-label="Remove">&times;</button></span>';
}).join('');
}

function submitDates(type) {
var picked = PICK[type].slice();
if (!picked.length) { setMsg(type, 'bad', 'Tap at least one date on the calendar first.'); return; }
var btn = document.getElementById('go-'+type);
btn.disabled = true; btn.innerHTML = 'Sending&hellip;';
function mineOn(ds) { var r = rowFor(type, ds); return r && (hasSponsor(r, SPONSOR) || r.sponsors === SPONSOR); }
function takenOn(ds) { var r = rowFor(type, ds); return r && isLocked(r.status) && r.sponsors !== SPONSOR; }
post({action:'request', type:type, sponsor:SPONSOR, dates:picked.join(',')})
.then(function(){
return confirmWrite(function(){ return picked.every(function(ds){ return mineOn(ds) || takenOn(ds); }); });
})
.then(function(done){
if (!done) throw new Error('unconfirmed');
PICK[type] = [];
drawCal(type);
var saved = picked.filter(mineOn), conflicts = picked.filter(takenOn);
var html = 'Request received for: <strong>' + saved.map(fmtDate).join(', ') + '</strong>. We\'ll confirm your date by email.';
if (conflicts.length) html += '<br>Just taken by another sponsor: ' + conflicts.map(fmtDate).join(', ') + '.';
setMsg(type, saved.length ? 'ok' : 'bad', saved.length ? html : 'Those dates were just taken by another sponsor. Please pick different dates.');
})
.catch(function(){
setMsg(type, 'bad', 'Something went wrong saving your request. Please try again, or email <a href="mailto:'+TEAM[0].e+'">'+TEAM[0].e+'</a> with your dates.');
})
.then(function(){
btn.disabled = false;
btn.innerHTML = type === 'story' ? 'Request Story Slot(s) &rarr;' : 'Request Eblast Date(s) &rarr;';
});
}

function directoryHTML() {
return SPONSORS.map(function(s){
var link = sponsorLink(s.n);
return '<div class="drow">'
+'<div class="drow-name">'+s.n+'<span class="tier tier-'+s.t+'">'+TIER_LABEL[s.t]+'</span></div>'
+'<div class="drow-actions">'
+'<button class="mini mini-p" onclick="copyDirect(this,\''+link.replace(/'/g, "\\'")+'\')">Copy Link</button>'
+'<a class="mini mini-s" href="'+link+'" target="_blank">View</a>'
+'<a class="mini mini-s" href="'+driveUrl(s.id)+'" target="_blank">Drive</a>'
+'</div></div>';
}).join('');
}

function copyDirect(btn, url) {
navigator.clipboard.writeText(url).then(function(){
var orig = btn.textContent;
btn.textContent = 'Copied!';
setTimeout(function(){ btn.textContent = orig; }, 1500);
});
}

// ---------- Admin: date request tracker ----------
var ADMIN = { type: 'eblast', key: '', past: false };
try { ADMIN.key = localStorage.getItem('ppAdminKey') || ''; } catch (e) {}

function trackerHTML() {
return '<div class="card"><div class="card-title">Date Requests</div>'
+'<div class="hint" style="margin-bottom:12px">Sponsor requests from the live calendar. Approve one date per sponsor &mdash; it greys out for everyone else and clears that sponsor\'s other requests.</div>'
+'<div class="field"><label>Admin key</label><input id="admKey" type="password" placeholder="Needed to approve or release" value="'+esc(ADMIN.key)+'" onchange="saveKey(this.value)"/></div>'
+'<div class="tabs"><button class="tab" id="tab-eblast" onclick="setTab(\'eblast\')">Eblasts</button>'
+'<button class="tab" id="tab-story" onclick="setTab(\'story\')">Stories</button>'
+'<button class="tab" id="tab-past" onclick="togglePast()">Show past</button>'
+'<button class="tab" onclick="refreshTracker()">Refresh</button></div>'
+'<div id="tracker"><div class="hint">Loading&hellip;</div></div>'
+'<div class="msg" id="msg-admin"></div></div>';
}

function saveKey(v) { ADMIN.key = v.trim(); try { localStorage.setItem('ppAdminKey', ADMIN.key); } catch (e) {} }
function setTab(t) { ADMIN.type = t; drawTracker(); }
function togglePast() { ADMIN.past = !ADMIN.past; drawTracker(); }
function refreshTracker() {
document.getElementById('tracker').innerHTML = '<div class="hint">Loading&hellip;</div>';
loadCalendar().then(drawTracker).catch(function(){
document.getElementById('tracker').innerHTML = '<div class="err">Couldn\'t reach the calendar backend.</div>';
});
}

function drawTracker() {
['eblast','story'].forEach(function(t){ document.getElementById('tab-'+t).className = 'tab' + (ADMIN.type===t?' on':''); });
document.getElementById('tab-past').className = 'tab' + (ADMIN.past?' on':'');
var rows = CAL[ADMIN.type].filter(function(r){
return (r.sponsors || r.status) && (ADMIN.past || r.date >= DATE_MIN);
}).sort(function(a,b){ return a.date < b.date ? -1 : 1; });
var el = document.getElementById('tracker');
if (!rows.length) { el.innerHTML = '<div class="hint">No '+(ADMIN.type==='story'?'story':'eblast')+' requests yet.</div>'; return; }
el.innerHTML = rows.map(function(r){
var st = isLocked(r.status) ? (r.status==='blocked'?'blocked':'booked') : 'requested';
var names = r.sponsors ? r.sponsors.split(',').map(function(x){ return x.trim(); }).filter(Boolean) : [];
var ranks = {};
(r.notes||'').split(';').forEach(function(n){ var m = n.trim().match(/^(.*) #(\d+)$/); if (m) ranks[m[1]] = m[2]; });
var sp = st === 'requested'
? names.map(function(n){
return '<span class="spn">'+esc(n)+(ranks[n]?' <span style="color:var(--muted)">#'+ranks[n]+'</span>':'')+'</span>'
+'<button class="mini mini-p" data-d="'+r.date+'" data-s="'+esc(n)+'" onclick="adminAct(\'approve\',this)">Approve</button>';
}).join('')
: (names.length ? '<span class="spn">'+esc(names.join(', '))+'</span>' : '')
+ (r.notes ? '<span class="hint">'+esc(r.notes)+'</span>' : '')
+ '<button class="mini mini-s" data-d="'+r.date+'" onclick="adminAct(\'release\',this)">Release</button>';
return '<div class="trow"><div class="trow-top"><span class="trow-date">'+fmtDate(r.date)+'</span>'
+'<span class="st st-'+st+'">'+st+'</span></div><div class="trow-sp">'+sp+'</div></div>';
}).join('');
}

function adminAct(action, btn) {
if (!ADMIN.key) { setMsg('admin', 'bad', 'Enter the admin key first.'); document.getElementById('admKey').focus(); return; }
var d = btn.getAttribute('data-d'), s = btn.getAttribute('data-s') || '';
if (action === 'release' && !confirmRelease(d)) return;
btn.disabled = true;
var t = ADMIN.type;
post({action:action, type:t, date:d, sponsor:s, key:ADMIN.key})
.then(function(){
return confirmWrite(function(){
var r = rowFor(t, d);
return action === 'approve' ? (r && isLocked(r.status) && r.sponsors === s) : !r;
});
})
.then(function(done){
drawTracker();
if (!done) throw new Error('Not saved. Check the admin key and try again.');
setMsg('admin', 'ok', (action==='approve' ? 'Approved '+esc(s)+' for ' : 'Released ') + fmtDate(d) + '.');
})
.catch(function(err){ btn.disabled = false; setMsg('admin', 'bad', esc(err.message)); });
}

function confirmRelease(d) {
var b = document.querySelector('[data-d="'+d+'"]');
if (b && b.getAttribute('data-arm') === '1') return true;
if (b) { b.setAttribute('data-arm','1'); b.textContent = 'Click again to release'; }
return false;
}

function renderAdmin() {
document.getElementById('main').innerHTML =
trackerHTML()
+'<div class="card"><div class="card-title">Sponsor Directory ('+SPONSORS.length+')</div>'
+'<div class="hint" style="margin-bottom:12px">Confirmed sponsors with a live Drive upload folder. Copy a sponsor\'s link and send it to them directly.</div>'
+'<div class="directory">'+directoryHTML()+'</div>'
+'</div>'
+'<div class="card"><div class="card-title">Generate Custom Link</div>'
+'<div class="hint" style="margin-bottom:14px">For a sponsor not yet in the directory above, or one flagged for a folder mismatch.</div>'
+'<div class="field"><label>Sponsor Name</label>'
+'<input id="inS" type="text" placeholder="e.g. Chris Turk"/>'
+'</div>'
+'<div class="field"><label>Sponsor Upload Folder (Google Drive URL)</label>'
+'<input id="inD" type="text" placeholder="https://drive.google.com/drive/folders/..."/>'
+'</div>'
+'<div class="row">'
+'<button class="abtn abtn-p" onclick="generate()">Generate Link</button>'
+'<a class="abtn abtn-s" href="'+KIT+'" target="_blank">Open Kit Folder</a>'
+'</div>'
+'<div class="out" id="out">'
+'<div class="out-lbl">Shareable Sponsor Link</div>'
+'<div class="out-url" id="outUrl"></div>'
+'<button class="cbtn" onclick="copyLink()">Copy Link</button>'
+'</div>'
+'</div>'
+'<div class="sec">Team</div>'
+'<div class="contacts">'+contactsHTML()+'</div>';
refreshTracker();
}

function generate() {
var s = (document.getElementById('inS').value||'').trim();
var d = (document.getElementById('inD').value||'').trim();
if (!s) { document.getElementById('inS').focus(); return; }
var url = linkFor(s, d);
document.getElementById('outUrl').textContent = url;
document.getElementById('out').style.display = 'block';
}

function copyLink() {
var url = document.getElementById('outUrl').textContent;
navigator.clipboard.writeText(url).then(function(){
var b = document.querySelector('#out .cbtn');
b.textContent = 'Copied!';
setTimeout(function(){ b.textContent = 'Copy Link'; }, 2000);
});
}

(function(){
var p = getParams();
if (p.sponsor) renderClient(p.sponsor, p.drive);
else renderAdmin();
})();
</script>
</body>
</html>
