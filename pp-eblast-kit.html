<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PP2026 Sponsor Eblast Kit</title>
<style>
:root{--pink:#d31876;--gray:#444;--light:#faf5f8;--border:#e8d0dc;--muted:#888}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--light);color:#2a2a2a;min-height:100vh}
.hdr{background:var(--pink);color:#fff;padding:30px 28px 24px}
.hdr-in{max-width:580px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-bottom:8px}
h1{font-size:26px;font-weight:700}
.hdr-sub{font-size:13px;opacity:.8;margin-top:5px}
.chip{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;margin-top:12px}
.main{max-width:580px;margin:0 auto;padding:30px 24px 60px}
.steps{display:flex;flex-direction:column;gap:14px}
.step{background:#fff;border:1px solid var(--border);border-radius:12px;padding:22px;display:flex;gap:16px}
.num{width:34px;height:34px;border-radius:50%;background:var(--pink);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.step h2{font-size:15px;font-weight:700;margin-bottom:4px}
.step p{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;width:100%;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-pink{background:var(--pink);color:#fff}
.btn-outline{background:#fff;color:var(--pink);border:2px solid var(--pink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.sec{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.contacts{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.crow{display:flex;align-items:center;gap:12px}
.av{width:32px;height:32px;border-radius:50%;background:var(--pink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ci strong{display:block;font-size:13px;font-weight:700}
.ci a{font-size:12px;color:var(--pink);text-decoration:none}
.ci a:hover{text-decoration:underline}
.cc{font-size:10px;color:var(--muted);background:#f2eef1;border-radius:4px;padding:1px 6px;margin-left:4px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:14px}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--pink);margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:5px}
.field input{width:100%;border:1.5px solid #ddd;border-radius:7px;padding:10px 12px;font-size:14px;color:#2a2a2a;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--pink)}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.abtn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;padding:11px 18px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;transition:opacity .15s}
.abtn:hover{opacity:.85}
.abtn-p{background:var(--pink);color:#fff}
.abtn-s{background:#fff;color:var(--gray);border:1.5px solid #ddd}
.out{background:#fff9fb;border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:16px;display:none}
.out-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
.out-url{font-size:12px;color:var(--pink);word-break:break-all;background:#fff;border:1px solid var(--border);border-radius:5px;padding:8px 10px;margin-bottom:10px;font-family:monospace}
.cbtn{background:var(--pink);color:#fff;border:none;border-radius:5px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer}
.cbtn:hover{opacity:.85}
.err{background:#fff4f4;border:1px solid #f0d0d0;border-radius:8px;padding:12px 14px;font-size:13px;color:#c0304a}
.directory{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.drow-name{font-size:13px;font-weight:700}
.tier{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-left:7px;vertical-align:middle}
.tier-platinum{background:#e4e8ee;color:#48566b}
.tier-gold{background:#f2e8d2;color:#a1791f}
.tier-silver{background:#eae7e0;color:#847e73}
.tier-bronze{background:#f0e2d6;color:#8a5837}
.tier-community{background:#eceae4;color:#8a887f}
.drow-actions{display:flex;flex-wrap:wrap;gap:6px}
.mini{font-size:11.5px;font-weight:700;border:none;border-radius:6px;padding:7px 11px;cursor:pointer;text-decoration:none;white-space:nowrap}
.mini-p{background:var(--pink);color:#fff}
.mini-s{background:#f2eef1;color:var(--gray)}
.dates{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.date-opt{display:flex;align-items:center;gap:10px;background:#fff9fb;border:1.5px solid var(--border);border-radius:9px;padding:12px 14px;cursor:pointer}
.date-opt input{width:17px;height:17px;accent-color:var(--pink)}
.date-opt span{font-size:13.5px;font-weight:600}
.date-count{font-size:11px;color:var(--muted);margin-bottom:12px}

.cal{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;background:#fff}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-hd strong{font-size:14px}
.cal-nav{background:#f2eef1;border:none;border-radius:6px;width:30px;height:30px;font-size:16px;cursor:pointer;color:var(--gray)}
.cal-nav[disabled]{opacity:.35;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:10px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.cal-day{position:relative;border:none;background:#fff9fb;border-radius:6px;height:36px;font-size:13px;font-weight:600;color:#2a2a2a;cursor:pointer}
.cal-day:hover{outline:1.5px solid var(--pink)}
.cal-day.off{background:transparent;color:#ccc;cursor:default;outline:none}
.cal-day.taken{background:#eee;color:#aaa;text-decoration:line-through;cursor:not-allowed;outline:none}
.cal-day.mine{background:#e6f4ea;color:#1e7a3a}
.cal-day.sel{background:var(--pink);color:#fff}
.cal-day .rk{position:absolute;top:1px;right:3px;font-size:9px;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:4px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.picked{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pchip{background:#fff;border:1.5px solid var(--pink);color:var(--pink);border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700}
.pchip button{background:none;border:none;color:var(--pink);font-weight:700;cursor:pointer;margin-left:4px}
.msg{font-size:12.5px;border-radius:8px;padding:10px 12px;margin-top:10px;display:none}
.msg.ok{display:block;background:#eef8f1;border:1px solid #cfe9d6;color:#1e7a3a}
.msg.bad{display:block;background:#fff4f4;border:1px solid #f0d0d0;color:#c0304a}
.msg.info{display:block;background:#f6f3f5;border:1px solid var(--border);color:var(--gray)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{border:1.5px solid var(--border);background:#fff;border-radius:7px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--gray)}
.tab.on{background:var(--pink);border-color:var(--pink);color:#fff}
.trow{border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#fff}
.trow-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trow-date{font-size:13px;font-weight:700}
.st{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:5px}
.st-requested{background:#fdf0d8;color:#9a6a12}
.st-booked{background:#e6f4ea;color:#1e7a3a}
.st-blocked{background:#eee;color:#777}
.trow-sp{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.spn{font-size:12px;background:#f7f3f6;border-radius:6px;padding:4px 8px}
.pkg{background:#fff;border:1px solid var(--border);border-left:4px solid var(--pink);border-radius:12px;padding:16px 20px;margin-bottom:14px}
.pkg ul{margin:0 0 0 18px;font-size:14px;line-height:1.7}
.naming{background:#faf5f8;border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin:0 0 14px}
.naming-h{font-size:12px;font-weight:700;color:var(--gray);margin-bottom:8px}
.nrow{display:flex;gap:10px;align-items:baseline;font-size:12px;margin-bottom:5px;flex-wrap:wrap}
.nrow code,.naming code{background:#fff;border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:12px;color:var(--pink);font-weight:700}
.nrow span{color:var(--muted)}
.tier-vipbag{background:#f3e3ee;color:#9a1d63}
/* ---- Obligations tracker (team view) ---- */
body.admin .hdr-in,body.admin .main{max-width:1240px}
.ob-sub{font-size:12px;color:var(--muted);line-height:1.55;margin:-4px 0 16px;max-width:110ch}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 16px;min-width:118px}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat.pink b{color:var(--pink)} .stat.ok b{color:#1e7a3a} .stat.warn b{color:#b5502e}
.ob-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.ob-search{flex:1;min-width:200px;border:1.5px solid #ddd;border-radius:8px;padding:9px 12px;font-size:13.5px;outline:none}
.ob-search:focus{border-color:var(--pink)}
.fchip{border:1.5px solid var(--border);background:#fff;border-radius:16px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--gray)}
.fchip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.ob-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:12px}
table.ob{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1080px}
table.ob th{position:sticky;top:0;background:#faf5f8;text-align:left;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}
table.ob td{padding:10px;border-bottom:1px solid #f1e6ec;vertical-align:top;line-height:1.45}
table.ob tr:last-child td{border-bottom:none}
table.ob tr.flag td:first-child{box-shadow:inset 3px 0 0 #e0902e}
table.ob tr.old td{color:#999}
.sp-name{font-weight:700;font-size:13px}
.sp-lead{font-size:11px;color:var(--muted);margin-top:2px}
.ob-n{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.ob-n.zero{color:#c9b8c2;font-weight:400}
.dash{color:#c9b8c2}
.dt{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 6px;margin:0 3px 3px 0;white-space:nowrap}
.dt-b{background:#e6f4ea;color:#1e7a3a} .dt-r{background:#fdf0d8;color:#9a6a12} .dt-n{background:#f6e2da;color:#b5502e} .dt-x{background:#eee;color:#888}
.note{font-size:11.5px;color:#555;min-width:220px;max-width:320px}
.note.fl{color:#9a4a10}
td.acts{min-width:150px}
td.acts .mini{padding:5px 8px;font-size:11px;margin:0 2px 3px 0;display:inline-block}
.mini.off{opacity:.4;pointer-events:none}
button.dt{border:none;cursor:pointer;font-family:inherit}
button.dt-r:hover{outline:1.5px solid #9a6a12}
button.dt-b:hover,button.dt-x:hover{outline:1.5px solid #888}
td.ct{font-size:11.5px;min-width:180px}
a.em{display:block;color:var(--pink);text-decoration:none;word-break:break-all}
a.em:hover{text-decoration:underline}
.own{font-size:12.5px;color:#2a2a2a;margin-bottom:5px}
.own.none{color:#b9a9b2}
a.sp-name{color:#2a2a2a;text-decoration:none}
a.sp-name:hover{color:var(--pink);text-decoration:underline}
.ob-bar.gen{background:#faf5f8;border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.gen-l{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ob-bar.gen .ob-search{padding:7px 10px;font-size:12.5px;min-width:160px}
.gen-out{font-size:12px;word-break:break-all}
.gen-out a{color:var(--pink)}
table.ob{min-width:980px}
.ob-foot{font-size:11px;color:var(--muted);margin-top:8px}
</style>
</head>

// Writes: fire-and-forget (no-cors). Apps Script's POST reply redirect is
// unreliable in browsers, so every write is confirmed by re-reading the sheet.
function post(params) {
var body = Object.keys(params).map(function(k){
return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
}).join('&');
return fetch(GAS_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body});
}
function sleep(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }
// Re-read until check(CAL) passes (or give up after ~15s).
function confirmWrite(check) {
var tries = 0;
function go() {
return loadCalendar().then(function(){
if (check()) return true;
if (++tries >= 4) return false;
return sleep(2500).then(go);
});
}
return sleep(1200).then(go);
}

}

function setMsg(type, cls, html) {
var m = document.getElementById('msg-'+type);
m.className = 'msg ' + cls; m.innerHTML = html;
}

function drawCal(type) {
var el = document.getElementById('cal-'+type);
var v = VIEW[type], y = v.getFullYear(), mo = v.getMonth();
var first = new Date(y, mo, 1).getDay(), days = new Date(y, mo+1, 0).getDate();
var minM = DATE_MIN.slice(0,7), maxM = DATE_MAX.slice(0,7), curM = ymd(v).slice(0,7);
var h = '<div class="cal-hd"><button class="cal-nav" '+(curM<=minM?'disabled':'')+' onclick="shiftCal(\''+type+'\',-1)">&lsaquo;</button>'
+'<strong>'+v.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</strong>'
+'<button class="cal-nav" '+(curM>=maxM?'disabled':'')+' onclick="shiftCal(\''+type+'\',1)">&rsaquo;</button></div>'
+'<div class="cal-grid">';
['S','M','T','W','T','F','S'].forEach(function(d){ h += '<div class="cal-dow">'+d+'</div>'; });
for (var i = 0; i < first; i++) h += '<div></div>';
for (var d = 1; d <= days; d++) {
var ds = ymd(new Date(y, mo, d)), row = rowFor(type, ds), cls = 'cal-day', dis = false, rk = '';
var idx = PICK[type].indexOf(ds);
if (ds < DATE_MIN || ds > DATE_MAX) { cls += ' off'; dis = true; }
else if (row && isLocked(row.status) && row.sponsors === SPONSOR && row.status !== 'blocked') { cls += ' mine'; dis = true; }
else if (row && isLocked(row.status)) { cls += ' taken'; dis = true; }
else if (idx !== -1) { cls += ' sel'; rk = '<span class="rk">'+(idx+1)+'</span>'; }
h += '<button class="'+cls+'" '+(dis?'disabled':'onclick="togglePick(\''+type+'\',\''+ds+'\')"')+'>'+d+rk+'</button>';
}
el.innerHTML = h + '</div>';
drawPicked(type);
}

function shiftCal(type, n) { var v = VIEW[type]; VIEW[type] = new Date(v.getFullYear(), v.getMonth()+n, 1); drawCal(type); }

function togglePick(type, ds) {
var arr = PICK[type], i = arr.indexOf(ds);
if (i !== -1) arr.splice(i, 1);
else if (arr.length >= MAXP[type]) { setMsg(type, 'bad', 'You can pick up to '+MAXP[type]+' dates. Remove one to add another.'); return; }
else arr.push(ds);
drawCal(type);
}

function drawPicked(type) {
document.getElementById('picked-'+type).innerHTML = PICK[type].map(function(ds, i){
return '<span class="pchip">#'+(i+1)+' '+fmtDate(ds)+'<button onclick="togglePick(\''+type+'\',\''+ds+'\')" aria-label="Remove">&times;</button></span>';
}).join('');
}

function submitDates(type) {
var picked = PICK[type].slice();
if (!picked.length) { setMsg(type, 'bad', 'Tap at least one date on the calendar first.'); return; }
var btn = document.getElementById('go-'+type);
btn.disabled = true; btn.innerHTML = 'Sending&hellip;';
function mineOn(ds) { var r = rowFor(type, ds); return r && (hasSponsor(r, SPONSOR) || r.sponsors === SPONSOR); }
function takenOn(ds) { var r = rowFor(type, ds); return r && isLocked(r.status) && r.sponsors !== SPONSOR; }
post({action:'request', type:type, sponsor:SPONSOR, dates:picked.join(',')})
.then(function(){
return confirmWrite(function(){ return picked.every(function(ds){ return mineOn(ds) || takenOn(ds); }); });
})
.then(function(done){
if (!done) throw new Error('unconfirmed');
PICK[type] = [];
drawCal(type);
var saved = picked.filter(mineOn), conflicts = picked.filter(takenOn);
var html = 'Request received for: <strong>' + saved.map(fmtDate).join(', ') + '</strong>. We\'ll confirm your date by email.';
if (conflicts.length) html += '<br>Just taken by another sponsor: ' + conflicts.map(fmtDate).join(', ') + '.';
setMsg(type, saved.length ? 'ok' : 'bad', saved.length ? html : 'Those dates were just taken by another sponsor. Please pick different dates.');
})
.catch(function(){
setMsg(type, 'bad', 'Something went wrong saving your request. Please try again, or email <a href="mailto:'+TEAM[0].e+'">'+TEAM[0].e+'</a> with your dates.');
})
.then(function(){
btn.disabled = false;
btn.innerHTML = type === 'story' ? 'Request Story Slot(s) &rarr;' : 'Request Eblast Date(s) &rarr;';
});
}

// ---------- Team view: obligations tracker + calendar ----------
var OB = { q:'', f:'all' };
var OB_FILTERS = [['all','All'],['owed','Eblast owed'],['req','Has requests'],['flag','Needs check'],['platinum','Platinum'],['gold','Gold'],['silver','Silver'],['bronze','Bronze'],['vipbag','VIP Bag'],['nofolder','No folder'],['old','Not 2026']];
var TODAY = ymd(new Date());

// Live calendar rows for one sponsor and type ('eblast' | 'story').
function calFor(type, name) {
var out = {booked:[], req:[]};
(CAL[type] || []).forEach(function(row){
if (!hasSponsor(row, name) && row.sponsors !== name) return;
if (row.status === 'blocked') return;
(isLocked(row.status) ? out.booked : out.req).push(row);
});
out.booked.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
out.req.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
return out;
}
function shortDate(s) { var p = s.split('-'); return (+p[1])+'/'+(+p[2]); }
function rankOf(row, name) {
var hit = (row.notes||'').split(';').map(function(x){ return x.trim().match(/^(.*) #(\d+)$/); }).filter(function(m){ return m && m[1] === name; })[0];
return hit ? '#'+hit[2]+' ' : '';
}

// Status cell: booked dates (Scheduled, then Sent/Posted once the date passes) and
// requested dates with inline approve. Click a booked date twice to release it.
function ownedLine(type, s) {
if (type === 'eblast') return s.eb ? s.eb + ' owed' : 'None owed';
var x = socSplit(s);
if (x) return x.stories + ' stor' + (x.stories===1?'y':'ies') + (x.shouts ? ' + ' + x.shouts + ' shout-out' + (x.shouts===1?'':'s') : '');
return s.soc ? s.soc.replace(/"/g,'') : 'None owed';
}
function statusCell(type, s, owed) {
var sx = type === 'story' ? socSplit(s) : null;
var tail = sx && sx.shouts ? '<span class="dt dt-x" title="Shout-outs are scheduled by the team">+'+sx.shouts+' shout-out'+(sx.shouts===1?'':'s')+'</span>' : '';
if (type === 'story' && !sx && s.soc && s.st == null) tail = '<span class="dt dt-x">'+esc(s.soc.replace(/"/g,''))+'</span>';
var head = '';
if (s.old) return '<span class="dt dt-x">'+esc(s.old)+'</span>';
if (!CAL_OK) return '<span class="dash">loading&hellip;</span>';
var c = calFor(type, s.n), h = '', done = type === 'eblast' ? 'Sent' : 'Posted';
c.booked.forEach(function(r){
var past = r.date < TODAY;
h += '<button class="dt '+(past?'dt-x':'dt-b')+'" title="Click twice to release" data-t="'+type+'" data-d="'+r.date+'" onclick="obAct(\'release\',this)">'+(past?done:'Scheduled')+' '+shortDate(r.date)+'</button>';
});
c.req.forEach(function(r){
h += '<button class="dt dt-r" title="Click to approve this date" data-t="'+type+'" data-d="'+r.date+'" data-s="'+esc(s.n)+'" onclick="obAct(\'approve\',this)">'+rankOf(r, s.n)+'Req '+shortDate(r.date)+' &#10003;</button>';
});
if (owed) { var left = owed - c.booked.length; if (left > 0) h += '<span class="dt dt-n">'+left+' to book</span>'; }
else if (type === 'eblast' && (c.booked.length || c.req.length)) h += '<span class="dt dt-n">Not owed: check</span>';
h += tail;
return h || '<span class="dash">&mdash;</span>';
}

// Social owed -> stories the sponsor requests + shout-outs the team decides.
// "N posts + M shout-outs" -> N stories; a plain total N -> half are stories (rounded up).
function socSplit(s) {
if (s.st != null) { var tot = (s.st||0) + (s.sh||0); return tot ? {total: tot, stories: s.st||0, shouts: s.sh||0} : null; }
var t = s.soc || '', m = t.match(/^(\d+)\s*posts?\s*\+\s*(\d+)\s*shout/i);
if (m) return {total: +m[1] + +m[2], stories: +m[1], shouts: +m[2]};
m = t.match(/^(\d+)/); if (!m) return null;
var n = +m[1], st = Math.ceil(n/2); return {total: n, stories: st, shouts: n - st};
}
function socOwed(s) { var x = socSplit(s); return x ? x.stories : 0; }

function hasReq(s) { return CAL_OK && (calFor('eblast', s.n).req.length || calFor('story', s.n).req.length); }

function obMatch(s) {
var f = OB.f;
if (f === 'old') { if (!s.old) return false; }
else if (s.old) return false;
if (f === 'owed' && !s.eb) return false;
if (f === 'req' && !hasReq(s)) return false;
if (f === 'flag' && !s.flag) return false;
if (f === 'nofolder' && s.id) return false;
if (TIER_LABEL[f] && s.t !== f) return false;
if (OB.q) {
var hay = [s.n, s.aka, s.ct, s.em, s.lead, s.note, s.soc].join(' ').toLowerCase();
if (hay.indexOf(OB.q) === -1) return false;
}
return true;
}

function contactCell(s) {
if (!s.em) return '<span class="dash">'+(ADMIN.key ? '&mdash;' : 'Enter admin key')+'</span>';
return (s.ct ? '<div>'+esc(s.ct)+'</div>' : '')
+ s.em.split(',').map(function(e){ e = e.trim(); return '<a class="em" href="mailto:'+esc(e)+'">'+esc(e)+'</a>'; }).join('');
}

function obRows() {
var rows = SPONSORS.map(function(s, i){ return {s:s, i:i}; }).filter(function(o){ return obMatch(o.s); });
if (!rows.length) return '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:24px">No sponsors match.</td></tr>';
return rows.map(function(o){
var s = o.s, i = o.i;
var acts = ((s.eb || hasSocial(s)) && s.em && !s.flag ? '<button class="mini mini-p" onclick="draftEmail(this,'+i+')">Draft email</button>' : '')
+ '<button class="mini mini-s" title="Copy this sponsor\'s page link (upload folder + date requests)" onclick="copyText(this, sponsorLink(SPONSORS['+i+'].n))">Asset link</button>';
var name = s.id ? '<a class="sp-name" href="'+driveUrl(s.id)+'" target="_blank" title="Open their Drive folder">'+esc(s.n)+'</a>' : '<div class="sp-name">'+esc(s.n)+'</div><div class="sp-lead">No Drive folder</div>';
return '<tr class="'+(s.flag?'flag ':'')+(s.old?'old':'')+'">'
+'<td>'+name+(s.aka?'<div class="sp-lead">aka '+esc(s.aka)+'</div>':'')+'</td>'
+'<td><span class="tier tier-'+s.t+'" style="margin-left:0">'+TIER_LABEL[s.t]+'</span></td>'
+'<td class="ct">'+contactCell(s)+'</td>'
+'<td>'+statusCell('eblast', s, s.eb)+'</td>'
+'<td>'+statusCell('story', s, socOwed(s))+'</td>'
+'<td class="acts">'+acts+'</td>'
+'<td><div class="note'+(s.flag?' fl':'')+'">'+(s.note?esc(s.note):'')+'</div></td></tr>';
}).join('');
}

function obStats() {
var live = SPONSORS.filter(function(s){ return !s.old; });
var owedS = live.filter(function(s){ return s.eb; });
var owed = owedS.reduce(function(a,s){ return a + s.eb; }, 0);
var booked = 0, sent = 0, reqS = 0, sOwed = 0, sBooked = 0;
live.forEach(function(s){ sOwed += socOwed(s); });
if (CAL_OK) {
owedS.forEach(function(s){ var b = calFor('eblast', s.n).booked.slice(0, s.eb); booked += b.length; sent += b.filter(function(r){ return r.date < TODAY; }).length; });
live.forEach(function(s){ if (hasReq(s)) reqS++; var n = socOwed(s); if (n) sBooked += Math.min(calFor('story', s.n).booked.length, n); });
}
function st(v, l, c) { return '<div class="stat '+(c||'')+'"><b>'+v+'</b><span>'+l+'</span></div>'; }
function w(v) { return CAL_OK ? v : '&hellip;'; }
return st(live.length, 'Sponsors (2026)') + st(owed, 'Eblasts owed', 'pink') + st(w(booked - sent), 'Scheduled', 'ok')
+ st(w(sent), 'Sent') + st(w(owed - booked), 'Eblasts to book', 'warn')
+ st(sOwed, 'Stories owed', 'pink') + st(w(sBooked), 'Stories booked', 'ok') + st(w(sOwed - sBooked), 'Stories to book', 'warn') + st(w(reqS), 'Sponsors w/ requests', 'pink')
+ st(live.filter(function(s){ return s.flag; }).length, 'Needs check', 'warn');
}

// Clipboard copy with a fallback for browsers that block navigator.clipboard.
function copyText(btn, text) {
function done(ok) { var o = btn.textContent; btn.textContent = ok ? 'Copied!' : 'Copy failed'; setTimeout(function(){ btn.textContent = o; }, 1500); }
function legacy() {
var ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
document.body.removeChild(ta); if (!ok) window.prompt('Copy this link:', text); done(ok);
}
if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function(){ done(true); }, legacy);
else legacy();
}
function copyDirect(btn, url) { copyText(btn, url); }
