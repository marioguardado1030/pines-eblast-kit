<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PP2026 Eblast Calendar</title>
<style>
:root{--pink:#d31876;--gray:#444;--light:#faf5f8;--border:#e8d0dc;--muted:#888}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--light);color:#2a2a2a;min-height:100vh}
.hdr{background:var(--pink);color:#fff;padding:26px 28px 22px}
.hdr-in{max-width:680px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-bottom:6px}
h1{font-size:24px;font-weight:700}
.hdr-sub{font-size:13px;opacity:.8;margin-top:4px}
.nav-back{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:rgba(255,255,255,.75);text-decoration:none;margin-bottom:10px;letter-spacing:.04em}
.nav-back:hover{color:#fff}
.sp-chip{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;margin-top:10px}
.main{max-width:680px;margin:0 auto;padding:26px 20px 60px}
/* Loading & error */
.loader-wrap{text-align:center;padding:60px 20px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:13px;color:var(--muted)}
.error-wrap{background:#fff;border:1px solid #f0c0c0;border-radius:12px;padding:24px;margin:20px 0;text-align:center}
.error-icon{font-size:28px;margin-bottom:10px}
.error-title{font-size:15px;font-weight:700;color:#c0304a;margin-bottom:6px}
.error-msg{font-size:12px;color:var(--muted);margin-bottom:16px;word-break:break-all}
.error-hint{font-size:11px;color:var(--muted);background:var(--light);border-radius:7px;padding:10px 14px;text-align:left;line-height:1.6}
.retry-btn{background:var(--pink);color:#fff;border:none;border-radius:7px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer;margin-top:14px}
.retry-btn:hover{opacity:.85}
/* Gas not configured warning */
.config-warn{background:#fff8e0;border:1px solid #f0d080;border-radius:12px;padding:20px;margin-bottom:20px;font-size:13px;line-height:1.6}
.config-warn strong{color:#7a5a00}
/* Calendar */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.month-label{font-size:17px;font-weight:700}
.mnav-btn{background:#fff;border:1.5px solid var(--border);border-radius:7px;padding:6px 14px;font-size:18px;cursor:pointer;color:var(--gray);line-height:1}
.mnav-btn:hover{border-color:var(--pink);color:var(--pink)}
.cal-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.dow{text-align:center;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 0}
.day-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{min-height:54px;border-radius:8px;border:1.5px solid transparent;padding:5px 6px;cursor:pointer;position:relative;transition:border-color .12s,background .12s}
.day:hover:not(.empty){border-color:var(--pink);background:#fff4f8}
.day.empty{cursor:default;pointer-events:none}
.day.blocked{background:#f0f0f0;cursor:not-allowed}
.day.blocked:hover{border-color:transparent;background:#f0f0f0}
.day.blocked .day-num{color:#bbb}
.day-num{font-size:13px;font-weight:600;color:#2a2a2a}
.day.empty .day-num{color:#ccc}
.day.today{background:#fff4f8;border-color:#f0a0c0}
/* Admin states */
.day.booked{background:#d31876;border-color:#b01060}
.day.booked .day-num{color:#fff}
.day.booked .day-count{color:rgba(255,255,255,.85)}
.day.booked:hover{background:#b01060;border-color:#900840}
.day.requested{background:#fce8f0;border-color:#e8a0c0}
/* Selected date highlight */
.day.selected{outline:3px solid #2a2a2a;outline-offset:-2px}
.day.booked.selected{outline:3px solid #fff;outline-offset:-3px}
.day-count{font-size:10px;font-weight:700;color:var(--pink);margin-top:2px;display:block}
.day-dot-row{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--pink);opacity:.7}
.day.booked .dot{background:#fff}
/* Sponsor selected state */
.day.sp-selected{background:#d31876;border-color:#b01060}
.day.sp-selected .day-num{color:#fff}
.day.sp-selected:hover{background:#b01060;border-color:#900840}
/* Legend */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray)}
.leg-swatch{width:14px;height:14px;border-radius:4px;border:1.5px solid transparent}
.leg-swatch.av{background:#fff;border-color:#ddd}
.leg-swatch.req{background:#fce8f0;border-color:#e8a0c0}
.leg-swatch.bkd{background:#d31876;border-color:#b01060}
.leg-swatch.blk{background:#f0f0f0;border-color:#ddd}
/* Admin detail panel */
.detail{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px;display:none}
.detail.open{display:block}
.detail-date{font-size:15px;font-weight:700;margin-bottom:14px}
.detail-sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
.sponsor-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.sponsor-item{display:flex;align-items:center;justify-content:space-between;background:var(--light);border-radius:7px;padding:8px 12px}
.sp-name{font-size:13px;font-weight:600}
.sp-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
.sp-del:hover{color:#c0304a}
.add-sponsor-row{display:flex;gap:8px}
.add-sp-input{flex:1;border:1.5px solid #ddd;border-radius:7px;padding:9px 11px;font-size:13px;outline:none;transition:border-color .15s}
.add-sp-input:focus{border-color:var(--pink)}
.add-sp-btn{background:var(--pink);color:#fff;border:none;border-radius:7px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
.add-sp-btn:hover{opacity:.85}
.status-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.s-btn{flex:1;min-width:80px;border-radius:7px;padding:9px 0;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid #ddd;background:#fff;color:var(--gray);transition:all .12s}
.s-btn.active-av{background:#e8ffe8;border-color:#80c080;color:#2a6a2a}
.s-btn.active-req{background:#fce8f0;border-color:#e8a0c0;color:var(--pink)}
.s-btn.active-bkd{background:var(--pink);border-color:#b01060;color:#fff}
.s-btn:hover{border-color:var(--pink)}
.s-btn.saving{opacity:.6;cursor:wait}
/* Saving indicator */
.save-status{font-size:11px;color:var(--muted);margin-top:10px;min-height:16px;transition:opacity .2s}
/* Summary */
.summary{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}
.summary-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--pink);margin-bottom:14px}
.top-date-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.top-date-row:last-child{border-bottom:none}
.td-left{font-size:13px;font-weight:600}
.td-right{font-size:12px;color:var(--muted)}
.td-badge{display:inline-block;background:#fce8f0;color:var(--pink);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;margin-left:8px}
.td-badge.bkd{background:var(--pink);color:#fff}
.empty-state{font-size:13px;color:var(--muted);padding:8px 0}
/* Export */
.export-row{display:flex;gap:10px;flex-wrap:wrap}
.exp-btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:opacity .15s}
.exp-btn:hover{opacity:.85}
.exp-pink{background:var(--pink);color:#fff}
.exp-outline{background:#fff;color:var(--gray);border:1.5px solid #ddd}
/* Sponsor submit panel */
.sp-panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}
.sp-panel-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--pink);margin-bottom:12px}
.sp-selection{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;min-height:32px}
.sp-sel-item{display:flex;align-items:center;gap:8px;background:var(--light);border-radius:7px;padding:8px 12px;font-size:13px;font-weight:600}
.sp-sel-dot{width:8px;height:8px;border-radius:50%;background:var(--pink);flex-shrink:0}
.sp-hint{font-size:12px;color:var(--muted);margin-bottom:16px}
.sp-submit{width:100%;background:var(--pink);color:#fff;border:none;border-radius:8px;padding:13px 0;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s}
.sp-submit:hover{opacity:.85}
.sp-submit:disabled{opacity:.4;cursor:not-allowed}
.sp-note{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.5}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-in">
    <a class="nav-back" id="backLink" href="./pp-eblast-kit.html">&larr; Back to Eblast Kit</a>
    <div class="eyebrow">Pines Party 2026 &mdash; Fire Island Pines</div>
    <h1 id="pgTitle">Eblast Scheduling Calendar</h1>
    <div class="hdr-sub" id="pgSub">Track sponsor date requests &amp; book send dates.</div>
    <div id="spChip" class="sp-chip" style="display:none"></div>
  </div>
</div>

<div class="main" id="mainWrap"></div>

<script>
// =========================================================
// CONFIG: GAS URL stored in localStorage (set via setup UI)
// =========================================================
function getGasUrl() {
  try { return localStorage.getItem('PP2026_GAS_URL') || ''; } catch(e) { return ''; }
}
function setGasUrl(url) {
  try { localStorage.setItem('PP2026_GAS_URL', url); } catch(e) {}
}
var GAS_URL = getGasUrl();

// =========================================================
// STATE
// =========================================================
var calData = {}; // { "2026-07-04": { status, sponsors:[], notes } }
var isLoading = false;
var loadError = null;
var selectedKey = null;
var spSelected = [];

var today = new Date();
var curYear = today.getFullYear();
var curMonth = today.getMonth();

var urlParams = new URLSearchParams(window.location.search);
var SPONSOR = urlParams.get('sponsor') || '';
var IS_SPONSOR = !!SPONSOR;

// =========================================================
// HELPERS
// =========================================================
function dateKey(y, m, d) {
  return y + '-' + (m + 1 < 10 ? '0' : '') + (m + 1) + '-' + (d < 10 ? '0' : '') + d;
}

function fmtLong(k) {
  var p = k.split('-');
  return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
  });
}

function fmtShort(k) {
  var p = k.split('-');
  return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-US', {
    month: 'short', day: 'numeric', year: 'numeric'
  });
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function gasConfigured() {
  return GAS_URL && GAS_URL.indexOf('https://script.google.com') === 0;
}

function showSetupScreen() {
  document.getElementById('main').innerHTML =
    '<div style="background:#fff;border:1px solid var(--border);border-radius:14px;padding:28px 24px;max-width:520px;margin:0 auto">' +
    '<div style="font-size:20px;font-weight:700;margin-bottom:6px">One-time Setup</div>' +
    '<div style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px">' +
    'This calendar stores data in Google Sheets via a Google Apps Script backend. ' +
    'Paste your deployed web app URL below to connect.' +
    '</div>' +
    '<div style="background:#faf5f8;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:20px;font-size:12px;line-height:1.8">' +
    '<strong style="display:block;margin-bottom:6px">Deploy the backend (one-time, 1 min):</strong>' +
    '1. Open <a href="https://script.google.com/u/0/home/projects/1fshtKfrmZgZsQQyV3UUGgY_WendYkn5DWEtpyKHnHRLA_RH8-N--GAnW/edit" target="_blank" rel="noopener noreferrer" style="color:var(--pink)">Apps Script Editor</a><br>' +
    '2. Click <strong>Deploy &rarr; New deployment</strong><br>' +
    '3. Type: <strong>Web app</strong>, Execute as: <strong>Me</strong>, Access: <strong>Anyone</strong><br>' +
    '4. Click <strong>Deploy</strong> &rarr; authorize &rarr; copy the URL<br>' +
    '5. Paste it below' +
    '</div>' +
    '<label style="font-size:12px;font-weight:600;color:var(--gray);display:block;margin-bottom:5px">Google Apps Script Web App URL</label>' +
    '<input id="gasUrlInput" type="text" placeholder="https://script.google.com/macros/s/.../exec" ' +
    'style="width:100%;border:1.5px solid #ddd;border-radius:7px;padding:10px 12px;font-size:13px;outline:none;margin-bottom:10px" ' +
    'onfocus="this.style.borderColor=\'var(--pink)\'" onblur="this.style.borderColor=\'#ddd\'"/>' +
    '<button onclick="saveGasUrl()" style="background:var(--pink);color:#fff;border:none;border-radius:8px;padding:11px 24px;font-size:14px;font-weight:700;cursor:pointer;width:100%">Connect &amp; Load Calendar</button>' +
    '</div>';
}

function saveGasUrl() {
  var input = document.getElementById('gasUrlInput');
  var url = (input ? input.value : '').trim();
  if (!url || url.indexOf('https://script.google.com') !== 0) {
    if (input) { input.style.borderColor = '#c0304a'; input.focus(); }
    return;
  }
  setGasUrl(url);
  GAS_URL = url;
  init();
}

// =========================================================
// GAS DATA LAYER
// =========================================================
function loadFromGAS(callback) {
  if (!gasConfigured()) {
    callback(null, {});
    return;
  }
  isLoading = true;
  loadError = null;
  renderLoader();

  var url = GAS_URL + '?_t=' + Date.now();
  fetch(url)
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(json) {
      if (json.error) throw new Error(json.error);
      var data = {};
      (json.rows || []).forEach(function(row) {
        if (!row.date) return;
        data[row.date] = {
          status: row.status || 'available',
          sponsors: row.sponsors
            ? row.sponsors.split(',').map(function(s) { return s.trim(); }).filter(Boolean)
            : [],
          notes: row.notes || ''
        };
      });
      isLoading = false;
      calData = data;
      callback(null, data);
    })
    .catch(function(err) {
      isLoading = false;
      loadError = err.message || 'Network error';
      callback(err, null);
    });
}

function saveToGAS(date, status, sponsors, notes, callback) {
  if (!gasConfigured()) {
    callback(new Error('GAS not configured'));
    return;
  }
  var body = new URLSearchParams();
  body.append('date', date);
  body.append('status', status);
  body.append('sponsors', Array.isArray(sponsors) ? sponsors.join(',') : (sponsors || ''));
  body.append('notes', notes || '');

  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString()
  })
    .then(function(res) { return res.json(); })
    .then(function(json) {
      if (!json.ok) throw new Error(json.error || 'Save failed');
      callback(null);
    })
    .catch(function(err) {
      callback(err);
    });
}

// =========================================================
// LOADER / ERROR STATES
// =========================================================
function renderLoader() {
  var wrap = document.getElementById('mainWrap');
  if (!wrap) return;
  wrap.innerHTML =
    '<div class="loader-wrap">' +
    '<div class="spinner"></div>' +
    '<div class="loader-text">Loading calendar from Google Sheets...</div>' +
    '</div>';
}

function renderErrorState() {
  var wrap = document.getElementById('mainWrap');
  if (!wrap) return;
  wrap.innerHTML =
    '<div class="error-wrap">' +
    '<div class="error-icon">&#9888;</div>' +
    '<div class="error-title">Could Not Load Calendar</div>' +
    '<div class="error-msg">' + esc(loadError || 'Unknown error') + '</div>' +
    '<div class="error-hint">' +
    '<strong>Checklist:</strong><br>' +
    '1. GAS web app is deployed (Extensions &gt; Apps Script &gt; Deploy)<br>' +
    '2. Access is set to "Anyone"<br>' +
    '3. The GAS_URL in calendar.html is updated with the correct web app URL' +
    '</div>' +
    '<button class="retry-btn" onclick="init()">Retry</button>' +
    '</div>';
}

// =========================================================
// RENDER CALENDAR GRID
// =========================================================
function renderCal() {
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var monthLabel = document.getElementById('monthLabel');
  if (monthLabel) monthLabel.textContent = months[curMonth] + ' ' + curYear;

  var firstDay = new Date(curYear, curMonth, 1).getDay();
  var dim = new Date(curYear, curMonth + 1, 0).getDate();
  var todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());
  var grid = document.getElementById('calGrid');
  if (!grid) return;
  grid.innerHTML = '';

  // Empty cells before first day
  for (var i = 0; i < firstDay; i++) {
    var e = document.createElement('div');
    e.className = 'day empty';
    e.innerHTML = '<span class="day-num"></span>';
    grid.appendChild(e);
  }

  for (var d = 1; d <= dim; d++) {
    var key = dateKey(curYear, curMonth, d);
    var rec = calData[key] || { status: 'available', sponsors: [], notes: '' };
    var st = rec.status || 'available';
    var sp = rec.sponsors || [];

    var cell = document.createElement('div');
    var cls = 'day';

    if (IS_SPONSOR) {
      // In sponsor mode: booked dates are blocked, selected dates highlighted
      if (st === 'booked') {
        cls += ' blocked';
      } else if (spSelected.indexOf(key) !== -1) {
        cls += ' sp-selected';
      } else if (key === todayKey) {
        cls += ' today';
      }
    } else {
      // Admin mode: all dates clickable
      if (key === todayKey) cls += ' today';
      if (st === 'booked') cls += ' booked';
      else if (st === 'requested' || sp.length > 0) cls += ' requested';
      if (key === selectedKey) cls += ' selected';
    }

    cell.className = cls;

    var inner = '<span class="day-num">' + d + '</span>';
    if (!IS_SPONSOR && sp.length > 0) {
      inner += '<span class="day-count">' + sp.length + ' req</span>';
      if (sp.length <= 5) {
        inner += '<div class="day-dot-row">' +
          sp.map(function() { return '<div class="dot"></div>'; }).join('') +
          '</div>';
      }
    }
    cell.innerHTML = inner;

    // Click handler: not blocked cells get click events
    if (!IS_SPONSOR || st !== 'booked') {
      cell.onclick = (function(k) {
        return function() {
          if (IS_SPONSOR) spSelectDay(k);
          else selectDay(k);
        };
      })(key);
    }

    grid.appendChild(cell);
  }
}

// =========================================================
// ADMIN MODE
// =========================================================
function selectDay(key) {
  selectedKey = key;
  renderCal();

  var rec = calData[key] || { status: 'available', sponsors: [], notes: '' };
  var sp = rec.sponsors || [];
  var st = rec.status || 'available';

  document.getElementById('detailDate').textContent = fmtLong(key);
  renderSpList(sp);
  updateStatusButtons(st);
  document.getElementById('saveStatus').textContent = '';
  document.getElementById('detail').className = 'detail open';
  document.getElementById('spInput').value = '';
}

function updateStatusButtons(st) {
  var btnAv = document.getElementById('btnAv');
  var btnReq = document.getElementById('btnReq');
  var btnBkd = document.getElementById('btnBkd');
  if (!btnAv) return;
  btnAv.className = 's-btn' + (st === 'available' || !st ? ' active-av' : '');
  btnReq.className = 's-btn' + (st === 'requested' ? ' active-req' : '');
  btnBkd.className = 's-btn' + (st === 'booked' ? ' active-bkd' : '');
}

function renderSpList(sp) {
  var list = document.getElementById('sponsorList');
  if (!list) return;
  if (!sp || sp.length === 0) {
    list.innerHTML = '<div class="empty-state">No sponsors yet.</div>';
    return;
  }
  list.innerHTML = sp.map(function(s, i) {
    return '<div class="sponsor-item">' +
      '<span class="sp-name">' + esc(s) + '</span>' +
      '<button class="sp-del" onclick="removeSponsor(' + i + ')">&#215;</button>' +
      '</div>';
  }).join('');
}

function setSaveStatus(msg, isError) {
  var el = document.getElementById('saveStatus');
  if (!el) return;
  el.textContent = msg;
  el.style.color = isError ? '#c0304a' : '#2a8a4a';
}

function setStatus(newStatus) {
  if (!selectedKey) return;
  var rec = calData[selectedKey] || { status: 'available', sponsors: [], notes: '' };
  rec.status = newStatus;
  calData[selectedKey] = rec;
  updateStatusButtons(newStatus);
  renderCal();
  setSaveStatus('Saving...', false);
  saveToGAS(selectedKey, rec.status, rec.sponsors, rec.notes, function(err) {
    if (err) {
      setSaveStatus('Save failed: ' + err.message, true);
    } else {
      setSaveStatus('Saved!', false);
      setTimeout(function() { setSaveStatus('', false); }, 2000);
    }
  });
  renderSummary();
}

function addSponsor() {
  var input = document.getElementById('spInput');
  var name = (input ? input.value || '' : '').trim();
  if (!name || !selectedKey) return;
  var rec = calData[selectedKey] || { status: 'available', sponsors: [], notes: '' };
  rec.sponsors = rec.sponsors || [];
  rec.sponsors.push(name);
  if (rec.status === 'available' || !rec.status) rec.status = 'requested';
  calData[selectedKey] = rec;
  if (input) input.value = '';
  renderSpList(rec.sponsors);
  updateStatusButtons(rec.status);
  renderCal();
  setSaveStatus('Saving...', false);
  saveToGAS(selectedKey, rec.status, rec.sponsors, rec.notes, function(err) {
    if (err) {
      setSaveStatus('Save failed: ' + err.message, true);
    } else {
      setSaveStatus('Saved!', false);
      setTimeout(function() { setSaveStatus('', false); }, 2000);
    }
  });
  renderSummary();
}

function removeSponsor(idx) {
  if (!selectedKey) return;
  var rec = calData[selectedKey];
  if (!rec || !rec.sponsors) return;
  rec.sponsors.splice(idx, 1);
  if (rec.sponsors.length === 0 && rec.status === 'requested') rec.status = 'available';
  calData[selectedKey] = rec;
  renderSpList(rec.sponsors);
  updateStatusButtons(rec.status);
  renderCal();
  setSaveStatus('Saving...', false);
  saveToGAS(selectedKey, rec.status, rec.sponsors, rec.notes, function(err) {
    if (err) {
      setSaveStatus('Save failed: ' + err.message, true);
    } else {
      setSaveStatus('Saved!', false);
      setTimeout(function() { setSaveStatus('', false); }, 2000);
    }
  });
  renderSummary();
}

function clearDay() {
  if (!selectedKey) return;
  delete calData[selectedKey];
  setSaveStatus('Saving...', false);
  saveToGAS(selectedKey, 'available', [], '', function(err) {
    if (err) setSaveStatus('Save failed: ' + err.message, true);
    else setSaveStatus('Cleared!', false);
  });
  document.getElementById('detail').className = 'detail';
  selectedKey = null;
  renderSummary();
  renderCal();
}

function renderSummary() {
  var entries = Object.keys(calData).map(function(k) {
    var r = calData[k];
    return { key: k, sponsors: r.sponsors || [], status: r.status || 'available' };
  }).filter(function(e) {
    return e.sponsors.length > 0 || e.status === 'booked' || e.status === 'requested';
  });

  entries.sort(function(a, b) {
    if (b.sponsors.length !== a.sponsors.length) return b.sponsors.length - a.sponsors.length;
    return a.key < b.key ? -1 : 1;
  });

  var list = document.getElementById('summaryList');
  if (!list) return;

  if (!entries.length) {
    list.innerHTML = '<div class="empty-state">No dates tracked yet. Click a date to start.</div>';
    return;
  }

  list.innerHTML = entries.slice(0, 10).map(function(e) {
    var badge = e.status === 'booked'
      ? '<span class="td-badge bkd">Booked</span>'
      : (e.sponsors.length > 0 ? '<span class="td-badge">' + e.sponsors.length + ' req</span>' : '');
    var spText = e.sponsors.length > 0
      ? '<span class="td-right">' + e.sponsors.map(esc).join(', ') + '</span>'
      : '';
    return '<div class="top-date-row">' +
      '<div class="td-left">' + fmtShort(e.key) + badge + '</div>' +
      spText + '</div>';
  }).join('');
}

function exportMonday() {
  var entries = Object.keys(calData).map(function(k) {
    var r = calData[k];
    return { key: k, sponsors: r.sponsors || [], status: r.status || 'available' };
  }).filter(function(e) {
    return e.sponsors.length > 0 || e.status === 'booked';
  });
  entries.sort(function(a, b) { return a.key < b.key ? -1 : 1; });
  if (!entries.length) { alert('No dates tracked yet.'); return; }
  var lines = entries.map(function(e) {
    return fmtShort(e.key) + '\t' +
      (e.status === 'booked' ? 'Booked' : 'Requested') + '\t' +
      (e.sponsors.join(', ') || '--');
  });
  navigator.clipboard.writeText('Send Date\tStatus\tSponsors\n' + lines.join('\n')).then(function() {
    var b = document.getElementById('exportMondayBtn');
    if (b) { b.textContent = 'Copied!'; setTimeout(function() { b.textContent = 'Export for Monday.com'; }, 2500); }
  }).catch(function() { alert('Copy failed. Please try manually.'); });
}

function exportText() {
  var entries = Object.keys(calData).map(function(k) {
    var r = calData[k];
    return { key: k, sponsors: r.sponsors || [], status: r.status || 'available' };
  }).filter(function(e) {
    return e.sponsors.length > 0 || e.status === 'booked';
  });
  entries.sort(function(a, b) { return a.key < b.key ? -1 : 1; });
  var lines = ['PP2026 Eblast Schedule\n'];
  entries.forEach(function(e) {
    lines.push((e.status === 'booked' ? '[BOOKED]' : '[Requested]') + ' ' +
      fmtShort(e.key) + (e.sponsors.length ? ' -- ' + e.sponsors.join(', ') : ''));
  });
  navigator.clipboard.writeText(lines.join('\n')).then(function() {
    var b = document.getElementById('exportTextBtn');
    if (b) { b.textContent = 'Copied!'; setTimeout(function() { b.textContent = 'Copy Plain Text'; }, 2500); }
  }).catch(function() { alert('Copy failed. Please try manually.'); });
}

// =========================================================
// SPONSOR MODE
// =========================================================
function spSelectDay(key) {
  var idx = spSelected.indexOf(key);
  if (idx !== -1) {
    spSelected.splice(idx, 1);
  } else if (spSelected.length < 3) {
    spSelected.push(key);
  }
  renderCal();
  renderSpPanel();
}

function renderSpPanel() {
  var list = document.getElementById('spSelList');
  var btn = document.getElementById('spSubmitBtn');
  if (!list) return;
  if (spSelected.length > 0) {
    list.innerHTML = spSelected.map(function(k) {
      return '<div class="sp-sel-item"><div class="sp-sel-dot"></div>' + fmtLong(k) + '</div>';
    }).join('');
  } else {
    list.innerHTML = '<div class="empty-state">Click up to 3 dates above to request them.</div>';
  }
  if (btn) btn.disabled = spSelected.length === 0;
}

function submitRequest() {
  var dates = spSelected.map(fmtLong);
  var body = 'Hi Mario,\n\n' + SPONSOR + ' would like to request the following eblast send date' +
    (dates.length > 1 ? 's' : '') + ':\n\n' +
    dates.map(function(d) { return '  - ' + d; }).join('\n') +
    '\n\nPlease confirm availability.\n\nThank you!';
  var subject = 'PP2026 Eblast Date Request - ' + SPONSOR;
  var mailto = 'mailto:mario.guardado@pinesparty.com' +
    '?cc=tdejsiriudom%40pinesparty.com%2Ctj%40pinesparty.com' +
    '&subject=' + encodeURIComponent(subject) +
    '&body=' + encodeURIComponent(body);
  window.location.href = mailto;
}

// =========================================================
// MONTH NAV
// =========================================================
function prevMonth() {
  curMonth--;
  if (curMonth < 0) { curMonth = 11; curYear--; }
  if (!IS_SPONSOR && selectedKey) {
    document.getElementById('detail').className = 'detail';
    selectedKey = null;
  }
  renderCal();
}

function nextMonth() {
  curMonth++;
  if (curMonth > 11) { curMonth = 0; curYear++; }
  if (!IS_SPONSOR && selectedKey) {
    document.getElementById('detail').className = 'detail';
    selectedKey = null;
  }
  renderCal();
}

// =========================================================
// INIT
// =========================================================
function init() {
  // Refresh GAS_URL from localStorage in case it was just set
  GAS_URL = getGasUrl();

  if (!gasConfigured()) {
    showSetupScreen();
    return;
  }

  var wrap = document.getElementById('mainWrap');
  if (!wrap) return;

  if (IS_SPONSOR) {
    document.getElementById('pgTitle').textContent = SPONSOR + ' - Select Your Dates';
    document.getElementById('pgSub').textContent = 'Pick up to 3 preferred eblast send dates.';
    var chip = document.getElementById('spChip');
    chip.textContent = SPONSOR;
    chip.style.display = 'inline-block';
    document.getElementById('backLink').style.display = 'none';
    buildSponsorUI(wrap);
  } else {
    buildAdminUI(wrap);
  }

  loadFromGAS(function(err) {
    if (err) {
      renderErrorState();
      return;
    }
    renderCal();
    if (!IS_SPONSOR) renderSummary();
  });
}

init();
</script>
