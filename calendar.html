<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PP2026 Eblast Calendar</title>
<style>
:root{--pink:#d31876;--gray:#444;--light:#faf5f8;--border:#e8d0dc;--muted:#888}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--light);color:#2a2a2a;min-height:100vh}
.hdr{background:var(--pink);color:#fff;padding:26px 28px 22px}
.hdr-in{max-width:680px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-bottom:6px}
h1{font-size:24px;font-weight:700}
.hdr-sub{font-size:13px;opacity:.8;margin-top:4px}
.nav-back{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:rgba(255,255,255,.75);text-decoration:none;margin-bottom:10px;letter-spacing:.04em}
.nav-back:hover{color:#fff}
.sp-chip{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;margin-top:10px}
.main{max-width:680px;margin:0 auto;padding:26px 20px 60px}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.month-label{font-size:17px;font-weight:700}
.mnav-btn{background:#fff;border:1.5px solid var(--border);border-radius:7px;padding:6px 14px;font-size:18px;cursor:pointer;color:var(--gray);line-height:1}
.mnav-btn:hover{border-color:var(--pink);color:var(--pink)}
.cal-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.dow{text-align:center;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 0}
.day-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{min-height:54px;border-radius:8px;border:1.5px solid transparent;padding:5px 6px;cursor:pointer;position:relative;transition:border-color .12s,background .12s}
.day:hover:not(.empty):not(.blocked){border-color:var(--pink);background:#fff4f8}
.day.empty{cursor:default}
.day.blocked{background:#f0f0f0;cursor:not-allowed}
.day.blocked .day-num{color:#bbb}
.day-num{font-size:13px;font-weight:600;color:#2a2a2a}
.day.empty .day-num{color:#ccc}
.day.today{background:#fff4f8;border-color:#f0a0c0}
.day.booked{background:#d31876;border-color:#b01060}
.day.booked .day-num{color:#fff}
.day.booked .day-count{color:rgba(255,255,255,.85)}
.day.requested{background:#fce8f0;border-color:#e8a0c0}
.day-count{font-size:10px;font-weight:700;color:var(--pink);margin-top:2px;display:block}
.day-dot-row{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--pink);opacity:.7}
.day.booked .dot{background:#fff}
.day.sp-selected{background:#d31876;border-color:#b01060}
.day.sp-selected .day-num{color:#fff}
.day.sp-selected::after{content:"â";position:absolute;bottom:4px;right:6px;font-size:11px;color:rgba(255,255,255,.9);font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray)}
.leg-swatch{width:14px;height:14px;border-radius:4px;border:1.5px solid transparent}
.leg-swatch.av{background:#fff;border-color:#ddd}
.leg-swatch.req{background:#fce8f0;border-color:#e8a0c0}
.leg-swatch.bkd{background:#d31876;border-color:#b01060}
.leg-swatch.blk{background:#f0f0f0;border-color:#ddd}
.detail{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px;display:none}
.detail.open{display:block}
.detail-date{font-size:15px;font-weight:700;margin-bottom:14px}
.detail-sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
.sponsor-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.sponsor-item{display:flex;align-items:center;justify-content:space-between;background:var(--light);border-radius:7px;padding:8px 12px}
.sp-name{font-size:13px;font-weight:600}
.sp-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
.sp-del:hover{color:#c0304a}
.add-sponsor-row{display:flex;gap:8px}
.add-sp-input{flex:1;border:1.5px solid #ddd;border-radius:7px;padding:9px 11px;font-size:13px;outline:none;transition:border-color .15s}
.add-sp-input:focus{border-color:var(--pink)}
.add-sp-btn{background:var(--pink);color:#fff;border:none;border-radius:7px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
.add-sp-btn:hover{opacity:.85}
.status-row{display:flex;gap:8px;margin-top:14px}
.s-btn{flex:1;border-radius:7px;padding:9px 0;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid #ddd;background:#fff;color:var(--gray);transition:all .12s}
.s-btn.active-req{background:#fce8f0;border-color:#e8a0c0;color:var(--pink)}
.s-btn.active-bkd{background:var(--pink);border-color:#b01060;color:#fff}
.s-btn:hover{border-color:var(--pink)}
.summary{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}
.summary-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--pink);margin-bottom:14px}
.top-date-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.top-date-row:last-child{border-bottom:none}
.td-left{font-size:13px;font-weight:600}
.td-right{font-size:12px;color:var(--muted)}
.td-badge{display:inline-block;background:#fce8f0;color:var(--pink);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;margin-left:8px}
.td-badge.bkd{background:var(--pink);color:#fff}
.empty-state{font-size:13px;color:var(--muted);padding:8px 0}
.export-row{display:flex;gap:10px;flex-wrap:wrap}
.exp-btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:opacity .15s}
.exp-btn:hover{opacity:.85}
.exp-pink{background:var(--pink);color:#fff}
.exp-outline{background:#fff;color:var(--gray);border:1.5px solid #ddd}
.sp-panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}
.sp-panel-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--pink);margin-bottom:12px}
.sp-selection{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;min-height:32px}
.sp-sel-item{display:flex;align-items:center;gap:8px;background:var(--light);border-radius:7px;padding:8px 12px;font-size:13px;font-weight:600}
.sp-sel-dot{width:8px;height:8px;border-radius:50%;background:var(--pink);flex-shrink:0}
.sp-hint{font-size:12px;color:var(--muted);margin-bottom:16px}
.sp-submit{width:100%;background:var(--pink);color:#fff;border:none;border-radius:8px;padding:13px 0;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s}
.sp-submit:hover{opacity:.85}
.sp-submit:disabled{opacity:.4;cursor:not-allowed}
.sp-note{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.5}
.gas-loader{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(250,245,248,.92);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.gas-loader.on{display:flex}
.gas-spinner{width:36px;height:36px;border:3px solid #e8d0dc;border-top-color:#d31876;border-radius:50%;animation:spin .7s linear infinite}
.gas-loader-txt{font-size:13px;color:#888;font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
.gas-err{background:#fff0f3;border:1px solid #f0c0cc;border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:13px;color:#b0304a;display:none;line-height:1.5}
.gas-err.on{display:block}
.setup-wrap{max-width:480px;margin:0 auto;padding:40px 20px}
.setup-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:28px}
.setup-eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--pink);margin-bottom:12px}
.setup-title{font-size:16px;font-weight:700;margin-bottom:8px}
.setup-desc{font-size:13px;color:#666;margin-bottom:20px;line-height:1.6}
.setup-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#888;display:block;margin-bottom:6px}
.setup-input{width:100%;border:1.5px solid #ddd;border-radius:7px;padding:10px 12px;font-size:13px;outline:none;margin-bottom:16px;font-family:inherit}
.setup-input:focus{border-color:var(--pink)}
.setup-btn{width:100%;background:var(--pink);color:#fff;border:none;border-radius:8px;padding:13px 0;font-size:14px;font-weight:700;cursor:pointer}
.setup-btn:hover{opacity:.85}
.setup-note{font-size:11px;color:#aaa;text-align:center;margin-top:14px;line-height:1.6}
</style>
</head>

<script>
var today=new Date();
var curYear=today.getFullYear();
var curMonth=today.getMonth();
var selectedKey=null;
var spSelected=[];
var calData={};
var GAS_URL='';

var params=new URLSearchParams(window.location.search);
var SPONSOR=params.get('sponsor')||'';
var BOOKED_PARAM=params.get('booked')||'';
var IS_SPONSOR=!!SPONSOR;
var urlBooked=BOOKED_PARAM?BOOKED_PARAM.split(',').filter(Boolean):[];

function loadLocal(){try{return JSON.parse(localStorage.getItem('pp2026cal')||'{}');}catch(e){return{};}}
function saveLocal(d){try{localStorage.setItem('pp2026cal',JSON.stringify(d));}catch(e){}}
function dateKey(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function fmtLong(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function fmtShort(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function loadFromGAS(callback){
  var url=GAS_URL+'?_t='+Date.now();
  fetch(url)
    .then(function(res){if(!res.ok)throw new Error('HTTP '+res.status);return res.json();})
    .then(function(json){
      var data={};
      (json.rows||[]).forEach(function(row){
        if(!row.date)return;
        data[row.date]={
          status:row.status||'',
          sponsors:row.sponsors?row.sponsors.split(',').map(function(s){return s.trim();}).filter(Boolean):[],
          notes:row.notes||''
        =;
      });
      saveLocal(data);
      callback(null,data);
    })
    .catch(function(err){callback(err,null);});
}

function saveToGAS(key,rec){
  if(!GAS_URL)return;
  var body='date='+encodeURIComponent(key)
    +'&status='+encodeURIComponent(rec.status||'')
    +'&sponsors='+encodeURIComponent((rec.sponsors||[]).join(','))
    +'&notes='+encodeURIComponent(rec.notes||'');
  fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
    .catch(function(e){console.warn('GAS save failed:',e);});
}

function showSetupScreen(){
  var wrap=document.getElementById('mainWrap');
  if(!wrap)return;
  wrap.innerHTML=
    '<div class="setup-wrap">'
    +'<div class="setup-card">'
      +'<div class="se4up-eyebrow">Initial Setup</div>'
      +'<div class="setup-title">Connect to Google Sheets</div>'
      +'<div class="setup-desc">Paste your Google Apps Script deployment URL below. This connects the calendar to your Google Sheet so data persists across devices and browsers.</div>'
      +'<label class="setup-label" for="setupUrlInput">Apps Script Deployment URL</label>'
      +'<input class="setup-input" id="setupUrlInput" type="text" placeholder="https://script.google.com/macros/s/â¦/exec"/>'
      +'<button class="setup-btn" onclick="saveSetup()">Connect &amp; Load Calendar</button>'

    +'</div>';
}

function isBlocked(key){
  if(IS_SPONSOR)return urlBooked.indexOf(key)!==-1;
  return (calData[key]||{}).status==='booked';
}

function renderCal(){
  var grid=document.getElementById('calGrid');
  var label=document.getElementById('monthLabel');
  if(!grid||!label)return;
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  label.textContent=months[curMonth]+' '+curYear;
  var firstDay=new Date(curYear,curMonth,1).getDay();
  var dim=new Date(curYear,curMonth+1,0).getDate();
  var todayKey=dateKey(today.getFullYear(),today.getMonth(),today.getDate());
  grid.innerHTML='';
  for(var i=0;i<firstDay;i++){var e=document.createElement('div');e.className='day empty';e.innerHTML='<span class="day-num"></span>';grid.appendChild(e);}
  for(var d=1;d<=dim;d++){
    var key=dateKey(curYear,curMonth,d);
    var blocked=isBlocked(key);
    var cell=document.createElement('div');
    var cls='day';
    if(IS_SPONSOR){
      if(blocked)cls+=' blocked';
      else if(spSelected.indexOf(key)!==-1)cls+=' sp-selected';
      else if(key===todayKey)cls+=' today';
    } else {
      var rec=calData[key]||{};
      var st=rec.status||'';
      var sp=rec.sponsors||[];
      if(key===todayKey)cls+=' today';
      if(st==='booked')cls+=' booked';
      else if(st==='requested'||sp.length>0)cls+=' requested';
      if(key===selectedKey)cls+=' selected';
    }
    cell.className=cls;
    var inner='<span class="day-num">'+d+'</span>';
    if(!IS_SPONSOR){
      var rec2=calData[key]||{};
      var sp2=rec2.sponsors||[];
      if(sp2.length>0)inner+='<span class="day-count">'+sp2.length+' req</span>';
      if(sp2.length>0&&sp2.length<=5)inner+='<div class="day-dot-row">'+sp2.map(function(){return'<div class="dot"></div>';}).join('')+'</div>';
    }
    cell.innerHTML=inner;
    if(!blocked)cell.onclick=(function(k){return function(){IS_SPONSOR?spSelectDay(k):selectDay(k);};})(key);
    grid.appendChild(cell);
  }
}

function spSelectDay(key){
  var idx=spSelected.indexOf(key);
  if(idx!==-1)spSelected.splice(idx,1);
  else if(spSelected.length<3)spSelected.push(key);
  renderCal();renderSpPanel();
}

function renderSpPanel(){
  var items=spSelected.length>0
    ?spSelected.map(function(k){return'<div class="sp-sel-item"><div class="sp-sel-dot"></div>'+fmtLong(k)+'</div>';}).join('')
    :'<div class="empty-state">Click up to 3 dates above to request them.</div>';
  document.getElementById('spSelList').innerHTML=items;
  document.getElementById('spSubmitBtn').disabled=spSelected.length===0;
}

function submitRequest(){
  var dates=spSelected.map(fmtLong);
  var body='Hi Mario,\n\n'+SPONSOR+' would like to request the following eblast send date'+(dates.length>1?'s':'')+':\n\n'
    +dates.map(function(d){return'  â¢ '+d;}).join('\n')
    +'\n\nPlease confirm availability.\n\nThank you!';
  var mailto='mailto:mario.guardado@pinesparty.com'
    +'?cc=tdejsiriudom@pinesparty.com,tj@pinesparty.com'
    +'&subject='+encodeURIComponent('PP2026 Eblast Date Request â '+SPONSOR)
    +'&body='+encodeURIComponent(body);
  window.location.href=mailto;
}

function selectDay(key){
  selectedKey=key;renderCal();
  var rec=calData[key]||{};
  var sp=rec.sponsors||[];var st=rec.status||'';
  document.getElementById('detailDate').textContent=fmtLong(key);
  renderSpList(sp);
  document.getElementById('btnReq').className='s-btn'+(st==='requested'?' active-req':'');
  document.getElementById('btnBkd').className='s-btn'+(st==='booked'?' active-bkd':'');
  document.getElementById('detail').className='detail open';
  document.getElementById('spInput').value='';
}

function renderSpList(sp){
  var list=document.getElementById('sponsorList');
  if(!sp||sp.length===0){list.innerHTML='<div class="empty-state">No sponsors yet.</div>';return;}
  list.innerHTML=sp.map(function(s,i){return'<div class="sponsor-item"><span class="sp-name">'+esc(s)+'</span><button class="sp-del" onclick="removeSponsor('+i+')">&#215;</button></div>';}).join('');
}

function addSponsor(){
  var name=(document.getElementById('spInput').value||'').trim();
  if(!name||!selectedKey)return;
  if(!calData[selectedKey])calData[selectedKey]={sponsors:[],status:'',notes:''};
  calData[selectedKey].sponsors.push(name);
  if(!calData[selectedKey].status)calData[selectedKey].status='requested';
  saveLocal(calData);saveToGAS(selectedKey,calData[selectedKey]);
  document.getElementById('spInput').value='';
  selectDay(selectedKey);renderSummary();renderCal();
}

function removeSponsor(i){
  if(!selectedKey)return;
  var rec=calData[selectedKey];if(!rec)return;
  rec.sponsors.splice(i,1);
  if(rec.sponsors.length===0&&rec.status==='requested')rec.status='';
  saveLocal(calData);saveToGAS(selectedKey,rec);
  selectDay(selectedKey);renderSummary();renderCal();
}

function setStatus(s){
  if(!selectedKey)return;
  if(!calData[selectedKey])calData[selectedKey]={sponsors:[],status:'',notes:''};
  calData[selectedKey].status=calData[selectedKey].status===s?'':s;
  saveLocal(calData);saveToGAS(selectedKey,calData[selectedKey]);
  selectDay(selectedKey);renderSummary();renderCal();
}

function clearDay(){
  if(!selectedKey)return;
  delete calData[selectedKey];
  saveLocal(calData);saveToGAS(selectedKey,{sponsors:[],status:'',notes:''});
  document.getElementById('detail').className='detail';
  selectedKey=null;renderSummary();renderCal();
}

function renderSummary(){
  var entries=Object.keys(calData).map(function(k){var r=calData[k];return{key:k,sponsors:r.sponsors||[],status:r.status||''};})
    .filter(function(e){return e.sponsors.length>0||e.status==='booked';});
  entries.sort(function(a,b){if(b.sponsors.length!==a.sponsors.length)return b.sponsors.length-a.sponsors.length;return a.key<b.key?-1:1;});
  var list=document.getElementById('summaryList');
  if(!entries.length){list.innerHTML='<div class="empty-state">No dates tracked yet. Click a date to start.</div>';return;}
  list.innerHTML=entries.slice(0,10).map(function(e){
    var badge=e.status==='booked'?'<span class="td-badge bkd">Booked</span>':(e.sponsors.length>0?'<span class="td-badge">'+e.sponsors.length+' req</span>':'');
    var sp=e.sponsors.length>0?'<span class="td-right">'+e.sponsors.map(esc).join(', ')+'</span>':'';
    return'<div class="top-date-row"><div class="td-left">'+fmtShort(e.key)+badge+'</div>'+sp+'</div>';
  }).join('');
}

function exportMonday(){
  var entries=Object.keys(calData).map(function(k){var r=calData[k];return{key:k,sponsors:r.sponsors||[],status:r.status||''};})
    .filter(function(e){return e.sponsors.length>0||e.status==='booked';});
  entries.sort(function(a,b){return a.key<b.key?-1:1;});
  if(!entries.length){alert('No dates tracked yet.');return;}
  var lines=entries.map(function(e){return fmtShort(e.key)+'\t'+(e.status==='booked'?'Booked':'Requested')+'\t'+(e.sponsors.join(', ')||'--');});
  navigator.clipboard.writeText('Send Date\tStatus\tSponsors\n'+lines.join('\n')).then(function(){
    var b=document.querySelector('.exp-pink');b.textContent='Copied!';setTimeout(function(){b.textContent='Copy for Monday.com';},2500);
  });
}

function exportText(){
  var entries=Object.keys(calData).map(function(k){var r=calData[k];return{key:k,sponsors:r.sponsors||[],status:r.status||''};})
    .filter(function(e){return e.sponsors.length>0||e.status==='booked';});
  entries.sort(function(a,b){return a.key<b.key?-1:1;});
  var lines=['PP2026 Eblast Schedule\n'];
  entries.forEach(function(e){lines.push((e.status==='booked'?'[BOOKED]':'[Requested]')+' '+fmtShort(e.key)+(e.sponsors.length?' -- '+e.sponsors.join(', '):''));});
  navigator.clipboard.writeText(lines.join('\n')).then(function(){
    var b=document.querySelector('.exp-outline');b.textContent='Copied!';setTimeout(function(){b.textContent='Copy Plain Text';},2500);
  });
}

function prevMonth(){curMonth--;if(curMonth<0){curMonth=11;curYear--;}if(!IS_SPONSOR){document.getElementById('detail').className='detail';selectedKey=null;}renderCal();}
function nextMonth(){curMonth++;if(curMonth>11){curMonth=0;curYear++;}if(!IS_SPONSOR){document.getElementById('detail').className='detail';selectedKey=null;}renderCal();}

function init(){
  GAS_URL=localStorage.getItem('PP2026_GAS_URL')||'';

  if(!GAS_URL){showSetupScreen();return;}

  var wrap=document.getElementById('mainWrap');
  if(!wrap)return;

  if(IS_SPONSOR){
    document.getElementById('pgTitle').textContent=SPONSOR+' â Select Your Dates';
    document.getElementById('pgSub').textContent='Pick up to 3 preferred eblast send dates.';
    var chip=document.getElementById('spChip');
    chip.textContent=SPONSOR;chip.style.display='inline-block';
    document.getElementById('backLink').style.display='none';
    buildSponsorUI(wrap);
  } else {
    buildAdminUI(wrap);
  }

  // Overlay spinner â DOM structure (incl. #calGrid) already exists above
  showLoading(true);

  loadFromGAS(function(err,data){
    showLoading(false);
    if(err){
      console.warn('GAS load error, using local cache:',err.message);
      calData=loadLocal();
      showError('Could not reach Google Sheets â showing cached data. Changes will sync when the connection restores.');
    } else {
      calData=data;
    }
    renderCal();
    if(!IS_SPONSOR)renderSummary();
  });
}

init();
</script>
